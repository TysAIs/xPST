# xPST media-binary provenance lock  (scripts/fetch-media-binaries.sh reads this)
#
# Every media binary that gets bundled into a release is named here by an
# IMMUTABLE url (a version tag, never `latest`) plus the SHA-256 of the exact
# file that url serves. The fetch script refuses to install anything whose bytes
# do not hash to the value below, so a release lane cannot silently ship a
# different binary and a moving-target mirror cannot break the lane.
#
# What is bundled: yt-dlp only. ffmpeg/ffprobe are deliberately NOT bundled any
# more (~87 MB of a 192 MB app); the engine resolves them at runtime
# (`XPST_FFMPEG_PATH` > system ffmpeg > a pinned, checksum-verified copy fetched
# on first use) and pins its own ffmpeg/ffprobe artifacts in
# src/xpst/media/binaries.py. This lock covers BUNDLE inputs, so it carries no
# ffmpeg rows: nothing here should describe a binary the lane does not ship.
#
# Candidate lines for the same (platform, artifact) are tried in file order;
# the first candidate that BOTH downloads and passes its checksum wins. A
# candidate that fails its checksum is a hard failure and is NOT skipped in
# silence - see the report at the end of scripts/fetch-media-binaries.sh.
#
# Columns (TAB separated):
#   platform  artifact  kind  member  sha256  url
#     platform  macos-arm64 | macos-x64 | linux-x64 | linux-arm64 | win-x64
#     artifact  yt-dlp   (win-x64 installs <artifact>.exe)
#     kind      raw | zip | tar.xz
#     member    path inside the archive (kind != raw); "-" for raw downloads
#     sha256    lowercase hex of the downloaded file
#     url       immutable download url
#
# Refresh procedure: scripts/update-media-binaries-lock.py --check (verifies
# every line against the upstream release API) then --write (re-pins hashes and
# records the pinned tags). See docs/media-binary-provenance.md.

