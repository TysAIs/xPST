[package]
name = "xpst-authflow"
description = "Credential acquisition flows: loopback redirect, headless paste, static secrets, with an explicit keychain fallback."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# Dependency licences, all permissive:
#   argon2, chacha20poly1305, sha2, subtle, zeroize, getrandom, base64,
#   keyring, serde, serde_json, thiserror  -- MIT OR Apache-2.0.
# No OpenSSL: the Linux keychain backend is dbus-secret-service, and the
# encrypted-file fallback uses RustCrypto primitives.
[dependencies]
argon2 = { version = "0.5.3", default-features = false, features = ["alloc"] }
base64 = "0.22"
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc"] }
getrandom = "0.2"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
subtle = "2.6"
thiserror = { workspace = true }
xpst-auth = { version = "1.3.0", path = "../xpst-auth" }
xpst-core = { path = "../xpst-core" }
zeroize = "1"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
