[package]
name = "xpst-cli"
description = "The `xpst` binary: full command tree, documented exit codes, local read paths."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "xpst"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
clap.workspace = true
getrandom = "0.4"
# `diagnostics` redacts log lines with the same four patterns the shipped
# `redact_log_line()` uses; `regex` is already in the graph (transitively).
regex = "1"
jiff.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
thiserror.workspace = true
xpst-auth = { version = "1.3.0", path = "../xpst-auth" }
# The ban-risk registry `readiness` reports (the same one `doctor` uses).
xpst-authflow = { version = "1.3.0", path = "../xpst-authflow" }
xpst-config.workspace = true
# The route-plan assembly (`preflight`) is engine behaviour, not CLI behaviour:
# it lives in `xpst-core` so the HTTP planner and the scheduler can read the same
# one, and this crate only supplies the machine-dependent half.
xpst-core = { version = "1.3.0", path = "../xpst-core" }
# The cooldown report (`rate_cooldowns.json`) is owned by the rate-limit crate so
# `doctor`, `health` and the MCP tool render one document.
xpst-limits = { version = "1.3.0", path = "../xpst-limits" }
xpst-media.workspace = true
# `mcp start` serves the agent surface in-process: one binary, one server. The
# crate owns the transport and the async runtime, so the CLI stays synchronous.
xpst-mcp = { version = "1.3.0", path = "../xpst-mcp" }
xpst-surface = { version = "1.3.0", path = "../xpst-surface" }
xpst-state.workspace = true
xpst-store = { version = "1.3.0", path = "../xpst-store" }

[dev-dependencies]
# The local-surface test seeds the encrypted credential store the way the
# capture script does, so a command that reads a stored secret (`bio`) sees the
# same value in both engines.
xpst-auth = { version = "1.3.0", path = "../xpst-auth" }
# The local-surface test builds the `analytics.db` fixture the capture script
# records as SQL statements (`best-time`).
rusqlite = { version = "0.41", features = ["bundled"] }

[lints]
workspace = true