[package]
name = "xpst-cli"
description = "The `xpst` binary: full command tree, documented exit codes, local read paths."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "xpst"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
clap.workspace = true
getrandom = "0.4"
jiff.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
thiserror.workspace = true
xpst-auth = { version = "1.3.0", path = "../xpst-auth" }
# The ban-risk registry `readiness` reports (the same one `doctor` uses).
xpst-authflow = { version = "1.3.0", path = "../xpst-authflow" }
xpst-config.workspace = true
xpst-media.workspace = true
xpst-state.workspace = true
xpst-store = { version = "1.3.0", path = "../xpst-store" }

[dev-dependencies]
# The local-surface test seeds the encrypted credential store the way the
# capture script does, so a command that reads a stored secret (`bio`) sees the
# same value in both engines.
xpst-auth = { version = "1.3.0", path = "../xpst-auth" }
# The local-surface test builds the `analytics.db` fixture the capture script
# records as SQL statements (`best-time`).
rusqlite = { version = "0.41", features = ["bundled"] }

[lints]
workspace = true
