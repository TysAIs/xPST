[package]
name = "xpst-core"
description = "Engine orchestration: pipeline, retry ownership, cooldowns (P2+)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# `json::sort_keys_recursive` is the workspace's one implementation of
# `json.dumps(..., sort_keys=True)`. It lives here, in the base crate, because
# the writers that need it are spread across `xpst-config`, `xpst-authflow`,
# `xpst-cli`, `xpst-mcp` and `xpst-api`, and `xpst-config` already dev-depends
# on `xpst-authflow` — putting the helper in either of those two would make the
# pair mutually dependent.
serde_json = { workspace = true }

[lints]
workspace = true

