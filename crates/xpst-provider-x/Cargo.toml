[package]
name = "xpst-provider-x"
description = "X destination (P2)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
default = ["live-http"]
# The reqwest-backed transport in [`http`]. On by default so the workspace gate
# builds and tests it; `--no-default-features` keeps the protocol-only graph.
live-http = ["xpst-provider/live-http"]

[dependencies]
base64 = "0.22"
hmac = "0.12"
serde_json = "1"
sha1 = "0.10"
thiserror = "2"
xpst-core = { version = "1.3.0", path = "../xpst-core" }
xpst-provider = { version = "1.3.0", path = "../xpst-provider" }

