name: Feature request
description: Suggest a new feature or improvement
title: "[feature] "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! Tell us what you'd like xPST to do.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve? What are you trying to do that xPST doesn't support today?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to happen? A CLI command, config option, UI behavior, MCP tool, etc.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or other approaches you've tried.
    validations:
      required: false

  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - CLI
        - Desktop app (PySide6/QML)
        - Dashboard (FastAPI)
        - MCP server
        - Provider / platform integration
        - Other
    validations:
      required: true

  - type: checkboxes
    id: tos
    attributes:
      label: Terms of Service awareness
      options:
        - label: I understand xPST prefers official APIs and that unofficial integrations may violate platform ToS.
          required: true
