name: Engine sidecars

# Build the standalone PyInstaller engine resource on each supported host.
# This workflow intentionally does not build or bundle the Tauri shell.
on:
  # Keep release branches self-testing before the workflow is present on main;
  # workflow_dispatch remains the normal manual trigger after merge.
  push:
    branches:
      - "release/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine-sidecars-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.platform }} engine
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos-arm64
          - os: windows-latest
            platform: windows-x64
          - os: ubuntu-latest
            platform: linux-x64

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install engine dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pyinstaller

      - name: Build engine sidecar
        shell: bash
        env:
          # setup-python puts this interpreter first on PATH on all runners;
          # passing it explicitly avoids a system python3 on macOS.
          PYTHON: python
        run: bash scripts/build-engine.sh

      - name: Write SHA256SUMS and report size
        shell: bash
        run: |
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          root = Path("src-tauri/binaries/engine")
          files = sorted(
              path for path in root.rglob("*")
              if path.is_file() and path.name != "SHA256SUMS"
          )
          if not files:
              raise SystemExit("engine directory is empty")
          lines = []
          total = 0
          for path in files:
              digest = sha256(path.read_bytes()).hexdigest()
              relative = path.relative_to(root).as_posix()
              lines.append(f"{digest}  {relative}\n")
              total += path.stat().st_size
          (root / "SHA256SUMS").write_text("".join(lines), encoding="ascii")
          print(f"{root}: {total} bytes ({total / 1024 / 1024:.1f} MiB)")
          print(f"SHA256SUMS entries: {len(lines)}")
          PY

      - name: Upload engine sidecar
        uses: actions/upload-artifact@v4
        with:
          name: xpst-engine-${{ matrix.platform }}
          path: src-tauri/binaries/engine
          if-no-files-found: error
          retention-days: 14

  verify:
    name: Verify ${{ matrix.platform }} artifact
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            executable: xpst-engine
          - platform: windows-x64
            executable: xpst-engine.exe
          - platform: linux-x64
            executable: xpst-engine

    steps:
      - name: Download engine artifact
        uses: actions/download-artifact@v4
        with:
          name: xpst-engine-${{ matrix.platform }}
          path: downloaded/${{ matrix.platform }}

      - name: Verify SHA256SUMS
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          EXECUTABLE: ${{ matrix.executable }}
        run: |
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import os

          root = Path("downloaded") / os.environ["PLATFORM"]
          sums_path = root / "SHA256SUMS"
          executable = root / os.environ["EXECUTABLE"]
          if not executable.is_file():
              raise SystemExit(f"missing expected executable: {executable}")

          entries = []
          for line in sums_path.read_text(encoding="ascii").splitlines():
              digest, relative = line.split("  ", 1)
              path = root / relative
              if not path.is_file():
                  raise SystemExit(f"missing checksum target: {relative}")
              actual = sha256(path.read_bytes()).hexdigest()
              if actual != digest:
                  raise SystemExit(f"checksum mismatch: {relative}")
              entries.append(relative)
          if not entries:
              raise SystemExit("SHA256SUMS is empty")
          print(f"{os.environ['PLATFORM']}: verified {len(entries)} files; executable={executable.name}")
          PY
