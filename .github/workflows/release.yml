name: Release

# The Python lane: wheel + sdist + SBOM + the GitHub release and its aggregate
# checksums. PyPI publishing is non-blocking (see the note on the step below).
#
# Desktop INSTALLERS are NOT built here. They are built by
# .github/workflows/tauri-release.yml from src-tauri/ plus the Python engine
# sidecar, which is the only desktop app this repository ships. The legacy
# PySide6/QML PyInstaller lanes (build_macos.spec / build_windows.spec /
# build_linux.spec) were removed because they produced a second bundle named
# xPST.app with the same bundle identifier (com.tysais.xpst) as the Tauri
# product.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[full,dev]" build pip-audit

      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Release gate
        run: |
          python -m pytest
          ruff check src tests
          mypy src/xpst
          pip-audit
          python scripts/scan_public_safety.py --json
          python scripts/build_package.py
          python scripts/release_preflight.py --json
          python scripts/clean_install_smoke.py --dist dist --artifact both
          python scripts/release_artifacts.py --dist dist --output-dir release/python --skip-checks --lane python

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-release
          path: release/python/*

      - name: Attest Python artifacts
        uses: actions/attest@v4
        with:
          subject-path: release/python/*

      - name: Publish to PyPI
        if: github.event_name == 'push'
        # Two mechanisms, tried in order:
        #   1. A PYPI_API_TOKEN secret (repo Settings > Secrets > Actions).
        #   2. PyPI trusted publishing (requires the repo's `id-token: write`
        #      permission, already granted, plus the owner configuring the PyPI
        #      side for this repo).
        # Non-blocking (continue-on-error) so the GitHub release is never held
        # hostage by the registry step.
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  github-release:
    if: github.event_name == 'push'
    needs: [build-python]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          generate_release_notes: true

      - name: Generate aggregate checksums
        run: |
          cd release-artifacts
          # Generate aggregate SHA256SUMS and SHA512SUMS across all lane artifacts
          sha256sum * > SHA256SUMS
          sha512sum * > SHA512SUMS

      - name: Upload aggregate checksums
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/SHA256SUMS
            release-artifacts/SHA512SUMS