name: CI

on:
  push:
    branches: ["main", "feat/knowledge-base", "codex/**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # setup-ffmpeg@v3 has an open upstream breakage ("TypeError: fetch
      # failed") affecting all runners since mid-2025; apt carries ffmpeg on
      # the ubuntu image. macos-latest runners are ARM64 → brew. Windows
      # runners ship chocolatey elevated, so choco is used there.
      - name: Install FFmpeg
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install FFmpeg (macOS arm64)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: Install package
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[full,dev]" build pip-audit

      - name: Test
        run: python -m pytest

      - name: Lint
        run: ruff check src tests

      - name: Type check
        run: mypy src/xpst

      - name: Security scan (Bandit)
        run: bandit -r src/xpst/ -ll

      - name: Vulnerability audit
        run: pip-audit

      - name: Public safety scan
        run: python scripts/scan_public_safety.py --json

      - name: Build package
        run: |
          python scripts/build_package.py
          python scripts/release_preflight.py --json

      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libpulse0

      - name: Desktop QML smoke
        shell: bash
        run: |
          python scripts/verify_desktop_package.py
          QT_QPA_PLATFORM=offscreen python scripts/verify_qml_pages.py

      - name: CLI smoke
        shell: bash
        run: |
          xpst version --json
          xpst health --json

  shell:
    name: Shell (Tauri/Rust)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies (Tauri v2)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            build-essential \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # tauri-build refuses to run unless every declared bundle resource path
      # exists. The real payloads (engine sidecar, yt-dlp, built UI) come from
      # the release lane; this gate only needs the shell to compile and its
      # unit tests to run, which is what the release lane is NOT run for.
      - name: Stub the bundle resource paths
        run: |
          mkdir -p ui/dist src-tauri/binaries/engine src-tauri/binaries/ytdlp
          echo '<!doctype html><title>ci</title>' > ui/dist/index.html
          echo stub > src-tauri/binaries/engine/xpst-engine-x86_64-unknown-linux-gnu
          echo stub > src-tauri/binaries/ytdlp/yt-dlp

      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Shell unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  docker:
    name: Docker build smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t xpst:ci .

      - name: Smoke Docker CLI
        run: docker run --rm xpst:ci version --json
