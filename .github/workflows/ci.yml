name: CI

on:
  push:
    branches: ["main", "feat/knowledge-base", "codex/**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # setup-ffmpeg@v3 has an open upstream breakage ("TypeError: fetch
      # failed") affecting all runners since mid-2025; apt carries ffmpeg on
      # the ubuntu image. macos-latest runners are ARM64 → brew. Windows
      # runners ship chocolatey elevated, so choco is used there.
      - name: Install FFmpeg
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install FFmpeg (macOS arm64)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: Install package
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[full,dev]" build pip-audit

      - name: Test
        run: python -m pytest

      - name: Lint
        run: ruff check src tests

      - name: Type check
        run: mypy src/xpst

      - name: Security scan (Bandit)
        run: bandit -r src/xpst/ -ll

      - name: Vulnerability audit
        # pillow 13.0.0 — the fix release for the 2026-10 pillow advisories —
        # requires Python >= 3.11, and instagrapi/fastembed pull pillow in, so a
        # 3.10 interpreter can only ever install 12.3.0 and the audit fails on
        # advisories that leg cannot fix. Audit on every supported interpreter
        # that can take the fixed build; 3.10's resolved set is still covered by
        # the 3.11-3.13 legs of this same matrix.
        if: matrix.python-version != '3.10'
        run: pip-audit

      - name: Public safety scan
        run: python scripts/scan_public_safety.py --json

      - name: Build package
        run: |
          python scripts/build_package.py
          python scripts/release_preflight.py --json

      - name: CLI smoke
        shell: bash
        run: |
          xpst version --json
          xpst health --json

  lockfile:
    name: Lockfile freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # uv.lock is generated with this exact uv version. A different uv can
      # rewrite the lockfile format or re-resolve transitively, which makes
      # `uv lock --check` fail for reasons unrelated to the change under test.
      # Bumping this `version` pin means regenerating uv.lock in the same PR.
      # The action major (v7 = node24) is independent of that pin and does not
      # change which uv gets installed.
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.4"
          python-version: "3.13"

      # The committed lock has to describe the extras declared in
      # pyproject.toml (e.g. the optional `browser` extra). Without this gate a
      # stale lock is invisible: the matrix installs with pip, never with uv.
      - name: Verify uv.lock matches pyproject.toml
        run: |
          if uv lock --check; then
            exit 0
          fi
          # A bare failure says nothing about *what* drifted; re-resolve and
          # show the difference so the fix is obvious from the log.
          echo "::error::uv.lock does not match pyproject.toml; uv expects these changes:"
          uv lock
          git --no-pager diff --stat -- uv.lock
          git --no-pager diff -U2 -- uv.lock | head -200
          exit 1

  shell:
    name: Shell (Tauri/Rust)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies (Tauri v2)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            build-essential \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # tauri-build refuses to run unless every declared bundle resource path
      # exists. The real payloads (engine sidecar, yt-dlp, built UI) come from
      # the release lane; this gate only needs the shell to compile and its
      # unit tests to run, which is what the release lane is NOT run for.
      - name: Stub the bundle resource paths
        run: |
          mkdir -p ui/dist src-tauri/binaries/engine src-tauri/binaries/ytdlp
          echo '<!doctype html><title>ci</title>' > ui/dist/index.html
          echo stub > src-tauri/binaries/engine/xpst-engine-x86_64-unknown-linux-gnu
          echo stub > src-tauri/binaries/ytdlp/yt-dlp

      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Shell unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  docker:
    name: Docker build smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t xpst:ci .

      - name: Smoke Docker CLI
        run: docker run --rm xpst:ci version --json

  # Rust engine rebuild, phase P0 (docs/PROPOSAL-RUST-REBUILD.md §5).
  #
  # This lane is additive: the Python matrix above stays the shipped surface and
  # is neither replaced nor weakened. It gates the workspace under `crates/` and
  # `xtask/`, which `src-tauri` is deliberately not a member of.
  rust:
    name: Rust engine (P0 scaffold)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins 1.99.1 so `fmt --check` and `clippy -D warnings`
      # mean the same thing here as they do on a developer machine.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      # The capture script introspects the real Click tree, so it needs the
      # Python engine importable. A base install (`-e .`, no extras) is enough
      # to import `xpst.cli`.
      #
      # `cargo xtask parity` compares the *command surface* (not the raw bytes:
      # provenance names the local commit, and Click's flag-default sentinel
      # varies by version), so this is the same check a developer runs.
      - name: CLI parity manifest is current
        run: |
          python -m pip install --quiet -e .
          XPST_PYTHON=python cargo xtask parity

      - name: Build release binary
        run: cargo build --release -p xpst-cli

      # First recorded data point against the <= 25 MB target in D-4. Reported,
      # not gated yet: P5 owns the budget.
      - name: Record release binary size
        run: |
          bytes=$(stat -c %s target/release/xpst)
          awk -v b="$bytes" 'BEGIN { printf "release binary: %d bytes (%.2f MiB)\n", b, b/1048576 }'
          echo "release-binary-bytes=$bytes" >> "$GITHUB_OUTPUT"

      - name: Security audit
        uses: taiki-e/install-action@cargo-audit

      - name: cargo audit
        run: cargo audit
