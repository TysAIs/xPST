name: CI

on:
  push:
    branches: ["main", "feat/knowledge-base", "codex/**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # setup-ffmpeg@v3 has an open upstream breakage ("TypeError: fetch
      # failed") affecting all runners since mid-2025; apt carries ffmpeg on
      # the ubuntu image. macos-latest runners are ARM64 → brew. Windows has no
      # system ffmpeg and is handled after the package install, below.
      - name: Install FFmpeg
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install FFmpeg (macOS arm64)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install package
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[full,dev]" build pip-audit

      # Windows: `choco install ffmpeg` is not a reliable way to get ffmpeg.
      # Measured 2026-11-25 (main 1dcbfcc, run 45688432461): the community feed
      # answered 504 (Gateway Timeout), choco printed "Chocolatey installed 0/0
      # packages" and still exited 0, so all four windows-latest legs ran with
      # no ffmpeg and six tests failed (FFmpegNotFoundError, a 404 media
      # preview, a readiness verdict counting ffmpeg as a missing setup item).
      # A step that reports success while installing nothing is the defect.
      #
      # Use the product's own pinned downloader instead: src/xpst/media/binaries.py
      # pins the immutable eugeneware/ffmpeg-static b6.1.1 tag plus a SHA-256 for
      # every asset, resumes partial transfers and smoke-runs the binary before
      # installing it. It lands in a runner-temp dir (never the runner's
      # ~/.xpst) which is then put on PATH, so every later step — including the
      # tests that pin HOME and XPST_CONFIG_DIR — resolves the same binaries.
      # Deliberately no choco fallback: an unpinned second source would defeat
      # the determinism, and the verification step below makes any failure loud.
      - name: Install FFmpeg (Windows, pinned + checksum-verified)
        if: runner.os == 'Windows'
        shell: bash
        env:
          XPST_MEDIA_BIN_DIR: ${{ runner.temp }}/xpst-media-bin
        run: |
          set -euo pipefail
          python -m xpst media fetch --json
          # GITHUB_PATH wants a native path. A mixed-separator entry still works
          # for Windows, and tests/test_cross_platform.py::test_ffmpeg_path_from_path_env
          # now normalises both sides, but the canonical form is what a human
          # reading `echo $PATH` expects, so normalise it exactly the way
          # pathlib does.
          python - "$XPST_MEDIA_BIN_DIR" "$GITHUB_PATH" <<'PY'
          import os
          import pathlib
          import sys

          bin_dir, github_path = sys.argv[1], sys.argv[2]
          path = pathlib.Path(bin_dir)
          if path.is_dir():
              with open(github_path, "a", encoding="utf-8") as handle:
                  handle.write(os.path.normpath(str(path)) + "\n")
          PY

      # Prove the binaries actually run before the suite depends on them, so a
      # silent no-op install can never reach the tests again.
      - name: Verify FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          for binary in ffmpeg ffprobe; do
            resolved="$(command -v "$binary" || true)"
            if [ -z "$resolved" ]; then
              echo "::error::$binary is not on PATH after the install step"
              exit 1
            fi
            echo "$binary -> $resolved"
            "$binary" -version
          done

      - name: Test
        run: python -m pytest

      - name: Lint
        run: ruff check src tests

      - name: Type check
        run: mypy src/xpst

      - name: Security scan (Bandit)
        run: bandit -r src/xpst/ -ll

      - name: Vulnerability audit
        # pillow 13.0.0 — the fix release for the 2026-10 pillow advisories —
        # requires Python >= 3.11, and instagrapi/fastembed pull pillow in, so a
        # 3.10 interpreter can only ever install 12.3.0 and the audit fails on
        # advisories that leg cannot fix. Audit on every supported interpreter
        # that can take the fixed build; 3.10's resolved set is still covered by
        # the 3.11-3.13 legs of this same matrix.
        if: matrix.python-version != '3.10'
        run: pip-audit

      # The personal identifiers that may never be committed are supplied by the
      # repository secret, never by the tree (see .public-safety-denylist).
      - name: Public safety scan
        env:
          XPST_PUBLIC_SAFETY_DENYLIST: ${{ secrets.XPST_PUBLIC_SAFETY_DENYLIST }}
        run: python scripts/scan_public_safety.py --json

      - name: Build package
        run: |
          python scripts/build_package.py
          python scripts/release_preflight.py --json

      - name: CLI smoke
        shell: bash
        run: |
          xpst version --json
          xpst health --json

  lockfile:
    name: Lockfile freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # uv.lock is generated with this exact uv version, so the committed lock
      # has to be a file this uv agrees with. Bumping this `version` pin means
      # regenerating uv.lock in the same PR.
      # Measured 2026-11-20: a lock re-resolved by a different uv (0.11.33, the
      # line Dependabot's uv updater ships) still passes this gate — the check
      # compares resolved content, not the file's `revision` line. What fails
      # here is a lock that no longer describes pyproject.toml, which is why
      # .github/dependabot.yml uses the `uv` ecosystem and not `pip`.
      # The action major (v7 = node24) is independent of that pin and does not
      # change which uv gets installed.
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.4"
          python-version: "3.13"

      # The committed lock has to describe the extras declared in
      # pyproject.toml (e.g. the optional `browser` extra). Without this gate a
      # stale lock is invisible: the matrix installs with pip, never with uv.
      - name: Verify uv.lock matches pyproject.toml
        run: |
          if uv lock --check; then
            exit 0
          fi
          # A bare failure says nothing about *what* drifted; re-resolve and
          # show the difference so the fix is obvious from the log.
          echo "::error::uv.lock does not match pyproject.toml; uv expects these changes:"
          uv lock
          git --no-pager diff --stat -- uv.lock
          git --no-pager diff -U2 -- uv.lock | head -200
          exit 1

  shell:
    name: Shell (Tauri/Rust)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system dependencies (Tauri v2)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            build-essential \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # tauri-build refuses to run unless every declared bundle resource path
      # exists. The real payloads (engine sidecar, yt-dlp, built UI) come from
      # the release lane; this gate only needs the shell to compile and its
      # unit tests to run, which is what the release lane is NOT run for.
      - name: Stub the bundle resource paths
        run: |
          mkdir -p ui/dist src-tauri/binaries/engine src-tauri/binaries/ytdlp
          echo '<!doctype html><title>ci</title>' > ui/dist/index.html
          echo stub > src-tauri/binaries/engine/xpst-engine-x86_64-unknown-linux-gnu
          echo stub > src-tauri/binaries/ytdlp/yt-dlp

      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Shell unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  # Licence policy, enforced rather than stated: docs/technical/licence-policy.md.
  #
  # Two mechanisms, deliberately. `cargo-deny` is the rich gate (licences, bans,
  # sources, advisories) but it is a separately installed binary; the lockfile
  # script needs nothing beyond Cargo, so the promise is still testable — and
  # still fails the build — on any machine or image that lacks cargo-deny. Both
  # surfaces are checked: the engine workspace and the Tauri shell, which has a
  # lockfile of its own.
  licences:
    name: Licence policy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"

      # The gate reads each crate's declared licence out of the metadata Cargo
      # caches, so the crates have to be present. `cargo test` never dials out;
      # this setup step is the only network use, and it is pinned by the
      # lockfiles.
      - name: Fetch locked dependencies
        run: |
          cargo fetch --locked
          cargo fetch --locked --manifest-path src-tauri/Cargo.toml

      - name: Licence check from the lockfiles (no extra binary)
        run: |
          python3 scripts/check_licences.py --check-config
          python3 scripts/check_licences.py --lockfile src-tauri/Cargo.lock

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: cargo deny (engine workspace)
        run: cargo deny check licenses bans sources advisories

      - name: cargo deny (Tauri shell)
        run: cargo deny --manifest-path src-tauri/Cargo.toml check licenses bans sources advisories

  docker:
    name: Docker build smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t xpst:ci .

      - name: Smoke Docker CLI
        run: docker run --rm xpst:ci version --json

  # Rust engine rebuild, phase P0 (docs/PROPOSAL-RUST-REBUILD.md §5).
  #
  # This lane is additive: the Python matrix above stays the shipped surface and
  # is neither replaced nor weakened. It gates the workspace under `crates/` and
  # `xtask/`, which `src-tauri` is deliberately not a member of.
  rust:
    name: Rust engine (P0 scaffold)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # rust-toolchain.toml pins 1.99.1 so `fmt --check` and `clippy -D warnings`
      # mean the same thing here as they do on a developer machine.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # `xpst-authflow` takes keyring's `sync-secret-service` feature on Linux,
      # which links libdbus-sys: clippy/test cannot build the workspace without
      # the dbus development headers on the runner ("Package dbus-1 was not
      # found in the pkg-config search path"). Same step as the binary-size
      # gate; both lanes build the workspace.
      - name: Install Linux system dependencies (libdbus for keyring)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends pkg-config libdbus-1-dev

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      # The capture script introspects the real Click tree, so it needs the
      # Python engine importable. `[mcp]` is required as well: the local-surface
      # check below replays `mcp list`, and without the extra the Python engine
      # answers `MCP_EXTRA_MISSING` where the Rust engine serves the registry.
      #
      # `cargo xtask parity` compares the *command surface* (not the raw bytes:
      # provenance names the local commit, and Click's flag-default sentinel
      # varies by version), so this is the same check a developer runs.
      - name: CLI parity manifest is current
        run: |
          python -m pip install --quiet -e ".[mcp]"
          XPST_PYTHON=python cargo xtask parity

      # The Rust tests replay checked-in fixtures captured from the Python
      # engine. This runs the same scenarios against BOTH engines in one go, so
      # a behaviour change on the Python side is caught here rather than at the
      # next fixture refresh. `target/debug/xpst` was built by the test step.
      - name: Local surface matches the Python engine
        run: |
          XPST_PYTHON=python python xtask/scripts/capture_local_surface.py \
            --check-with target/debug/xpst

      # The ledger is generated from the engine's own tables; this fails when
      # someone implements a command without regenerating the doc.
      - name: Parity ledger is current
        run: cargo xtask ledger

      - name: Build release binary
        run: cargo build --release -p xpst-cli

      # Report against the <= 25 MB target in D-4. The *gate* is
      # .github/workflows/rust-binary-size.yml, which builds the whole workspace
      # and asserts the budgets in perf/rust-binary-budget.json; this step keeps
      # the number in the CI log for every Rust change, including ones that do
      # not touch the paths the gate lane watches.
      - name: Record release binary size
        run: |
          python3 scripts/check_rust_binary_size.py \
            --binary target/release/xpst \
            --report-only

      - name: Security audit
        uses: taiki-e/install-action@cargo-audit

      - name: cargo audit
        run: cargo audit
