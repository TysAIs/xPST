name: Publish Python package to PyPI

on:
  release:
    types: [published]
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Build sdist and wheel
        run: uv build

      - name: Validate distribution metadata
        run: uvx --from twine twine check dist/*

      # Fail while the release identity is still cheap to fix. A PyPI filename
      # can never be replaced, so publishing the wrong version under a tag is
      # unrecoverable without bumping the version again.
      - name: Check the release identity before it can publish
        env:
          TOKEN_PRESENT: ${{ secrets.PYPI_API_TOKEN != '' }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # Every line goes to the log as well as the job summary, so the
          # evidence is readable from `gh run view --log`, not only in the UI.
          say() { printf '%s\n' "$1" | tee -a "$GITHUB_STEP_SUMMARY"; }
          version=$(grep -m1 -E '^version[[:space:]]*=' pyproject.toml | cut -d'"' -f2 || true)
          say "### PyPI release identity"
          say ""
          say "| field | value |"
          say "| --- | --- |"
          say "| pyproject version | \`${version:-<missing>}\` |"
          say "| event | \`${EVENT_NAME}\` |"
          say "| ref under test | \`${REF_TYPE}:${REF_NAME}\` |"
          say "| PYPI_API_TOKEN secret | present=\`${TOKEN_PRESENT}\` (presence only; the value is never read) |"
          if [ -z "$version" ]; then
            echo "::error::Could not read [project].version from pyproject.toml"
            exit 1
          fi
          if [ "$REF_TYPE" = "tag" ] && [ "$REF_NAME" != "v$version" ]; then
            echo "::error::Tag $REF_NAME does not match pyproject version $version. This run would upload $version, and PyPI files are immutable."
            exit 1
          fi
          # The credential check follows the workflow itself: a `password:` input in
          # this file means the token path, and then a missing secret must fail
          # here rather than after the build. Without that input the publish step
          # is on trusted publishing (docs/PYPI.md), which needs no secret.
          if grep -qE '^[[:space:]]*password:[[:space:]]*[$][{][{] secrets[.]' .github/workflows/publish-pypi.yml; then
            say "credential path: stored token (this workflow passes a \`password:\` input)."
            if [ "$TOKEN_PRESENT" != "true" ]; then
              echo "::error::This workflow publishes with a stored password, but the PYPI_API_TOKEN repository secret is not readable, so the token path cannot work. Add the secret, or switch the publish step to trusted publishing (docs/PYPI.md)."
              exit 1
            fi
          else
            say ""
            say "credential path: trusted publishing (no \`password:\` input in this workflow); it needs a registered publisher on PyPI and \`id-token: write\`."
          fi
          index_status=$(curl -sS -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/xpst/${version}/json" || true)
          say ""
          if [ "$index_status" = "200" ]; then
            say "pypi.org already serves xpst ${version}: the publish step will report existing files as skipped (skip-existing)."
          else
            say "pypi.org status for xpst ${version}: \`${index_status}\` (project-wide status is 404 until the first publish)."
          fi


      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: pypi-distributions
          path: dist/*
          if-no-files-found: error

  publish:
    # A manual dispatch is a build/validation run only. Publishing is limited
    # to a published GitHub release or a version tag.
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: pypi-distributions
          path: dist

      # Credential path: the PYPI_API_TOKEN repository secret (a PyPI API token).
      # This is the path that works today, because no trusted publisher is
      # registered on PyPI for this repository.
      #
      # Alternative (NOT in use): PyPI trusted publishing. It stores no secret,
      # but it needs a one-time account-scoped registration on PyPI
      # (pypi.org -> Your projects -> Publishing -> Add a pending publisher with
      # owner `TysAIs`, repository xPST, workflow publish-pypi.yml, environment
      # "pypi"). Switching to it means: re-add `id-token: write` to the workflow
      # and publish-job permissions, re-add `environment: pypi`, and drop the
      # `password:` input below. docs/PYPI.md documents both paths.
      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
          # A version tag and a published GitHub release both reach this job, and
          # release.yml uploads the same files on a tag push. PyPI keeps the first
          # copy and rejects the rest with "file already exists"; without this,
          # the loser of that race goes red even though the release is fine.
          # It also makes a re-run of a failed publish idempotent.
          skip-existing: true
