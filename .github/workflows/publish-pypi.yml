name: Publish Python package to PyPI

on:
  release:
    types: [published]
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Build sdist and wheel
        run: uv build

      - name: Validate distribution metadata
        run: uvx --from twine twine check dist/*

      # Fail while the release identity is still cheap to fix. A PyPI filename
      # can never be replaced, so publishing the wrong version under a tag is
      # unrecoverable without bumping the version again.
      - name: Check the release identity before it can publish
        env:
          TOKEN_PRESENT: ${{ secrets.PYPI_API_TOKEN != '' }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          version=$(grep -m1 -E '^version[[:space:]]*=' pyproject.toml | cut -d'"' -f2 || true)
          {
            echo "### PyPI release identity"
            echo ""
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| pyproject version | \`${version:-<missing>}\` |"
            echo "| event | \`${EVENT_NAME}\` |"
            echo "| ref under test | \`${REF_TYPE}:${REF_NAME}\` |"
            echo "| PYPI_API_TOKEN secret | present=\`${TOKEN_PRESENT}\` (presence only; the value is never read) |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$version" ]; then
            echo "::error::Could not read [project].version from pyproject.toml"
            exit 1
          fi
          if [ "$REF_TYPE" = "tag" ] && [ "$REF_NAME" != "v$version" ]; then
            echo "::error::Tag $REF_NAME does not match pyproject version $version. This run would upload $version, and PyPI files are immutable."
            exit 1
          fi
          if [ "$TOKEN_PRESENT" != "true" ]; then
            echo "::error::The PYPI_API_TOKEN repository secret is not readable by this workflow, so the token publish path cannot work. Add the secret, or switch this job to trusted publishing (docs/PYPI.md)."
            exit 1
          fi
          index_status=$(curl -sS -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/xpst/${version}/json" || true)
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "$index_status" = "200" ]; then
            echo "pypi.org already serves xpst ${version}: the publish step will report existing files as skipped (skip-existing)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "pypi.org status for xpst ${version}: \`${index_status}\` (project-wide status is 404 until the first publish)." >> "$GITHUB_STEP_SUMMARY"
          fi


      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: pypi-distributions
          path: dist/*
          if-no-files-found: error

  publish:
    # A manual dispatch is a build/validation run only. Publishing is limited
    # to a published GitHub release or a version tag.
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: pypi-distributions
          path: dist

      # Credential path: the PYPI_API_TOKEN repository secret (a PyPI API token).
      # This is the path that works today, because no trusted publisher is
      # registered on PyPI for this repository.
      #
      # Alternative (NOT in use): PyPI trusted publishing. It stores no secret,
      # but it needs a one-time account-scoped registration on PyPI
      # (pypi.org -> Your projects -> Publishing -> Add a pending publisher with
      # owner `TysAIs`, repository xPST, workflow publish-pypi.yml, environment
      # "pypi"). Switching to it means: re-add `id-token: write` to the workflow
      # and publish-job permissions, re-add `environment: pypi`, and drop the
      # `password:` input below. docs/PYPI.md documents both paths.
      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
          # A version tag and a published GitHub release both reach this job, and
          # release.yml uploads the same files on a tag push. PyPI keeps the first
          # copy and rejects the rest with "file already exists"; without this,
          # the loser of that race goes red even though the release is fine.
          # It also makes a re-run of a failed publish idempotent.
          skip-existing: true
