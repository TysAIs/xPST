name: Publish Python package to PyPI

on:
  release:
    types: [published]
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Build sdist and wheel
        run: uv build

      - name: Validate distribution metadata
        run: uvx --from twine twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: pypi-distributions
          path: dist/*
          if-no-files-found: error

  publish:
    # A manual dispatch is a build/validation run only. Publishing is limited
    # to a published GitHub release or a version tag.
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: pypi-distributions
          path: dist

      # Credential path: the PYPI_API_TOKEN repository secret (a PyPI API token).
      # This is the path that works today, because no trusted publisher is
      # registered on PyPI for this repository.
      #
      # Alternative (NOT in use): PyPI trusted publishing. It stores no secret,
      # but it needs a one-time account-scoped registration on PyPI
      # (pypi.org -> Your projects -> Publishing -> Add a pending publisher with
      # owner `TysAIs`, repository xPST, workflow publish-pypi.yml, environment
      # "pypi"). Switching to it means: re-add `id-token: write` to the workflow
      # and publish-job permissions, re-add `environment: pypi`, and drop the
      # `password:` input below. docs/PYPI.md documents both paths.
      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
