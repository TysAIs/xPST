name: Tauri Shell Release

# Builds the Tauri 2 desktop shell (xPST.app) with the Python engine sidecar.
# Triggers on version tags (v*) and manual dispatch. Artifacts: .app, .dmg,
# updater (.app.tar.gz + .sig). Notarization runs only when Apple secrets exist.

on:
  push:
    tags:
      - "v*.*.*"
    paths:
      - "src-tauri/**"
      - "ui/**"
      - "build_engine.spec"
      - "scripts/build-engine.sh"
      - "scripts/verify_release_version.py"
      - "pyproject.toml"
      - ".github/workflows/tauri-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tauri-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: "app,dmg"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Verify release version
        run: python scripts/verify_release_version.py

      - name: Build Svelte UI
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Install Python engine deps (sidecar build)
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[full]" pyinstaller

      - name: Build engine sidecar (PyInstaller onedir)
        run: |
          scripts/build-engine.sh
          test -f ui/dist/index.html
          test -x src-tauri/binaries/engine/xpst-engine
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"

      - name: Fetch media binaries (ffmpeg/ffprobe/yt-dlp)
        run: |
          chmod +x scripts/fetch-media-binaries.sh
          scripts/fetch-media-binaries.sh

      - name: Import Apple signing cert (if secrets present)
        if: env.APPLE_CERTIFICATE != null && env.APPLE_CERTIFICATE != ''
        id: cert
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}

      - name: Install Tauri CLI
        run: |
          cargo install tauri-cli --version 2.11.4 --locked
          test -x "$HOME/.cargo/bin/cargo-tauri"
          "$HOME/.cargo/bin/cargo-tauri" --version

      - name: Build Tauri app + DMG
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo tauri build --target "${{ matrix.target }}" --bundles "${{ matrix.bundles }}"
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Verify bundle size and resources
        run: |
          set -euo pipefail
          APP_PATH="$(find src-tauri/target -type d -path '*/release/bundle/macos/xPST.app' -print -quit)"
          test -n "$APP_PATH"
          test -f "$APP_PATH/Contents/Resources/ui/index.html"
          test -x "$APP_PATH/Contents/Resources/binaries/engine/xpst-engine"
          SIZE_MB="$(du -sm "$APP_PATH" | cut -f1)"
          echo "xPST.app size: ${SIZE_MB}MB"
          if [ "$SIZE_MB" -gt 200 ]; then
            echo "::error::Bundle ${SIZE_MB}MB exceeds 200MB gate"
            exit 1
          fi

      - name: Smoke boot (app launches, engine healthy)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          APP_PATH="$(find src-tauri/target -type d -path '*/release/bundle/macos/xPST.app' -print -quit)"
          APP_EXEC="$APP_PATH/Contents/MacOS/xPST"
          test -x "$APP_EXEC"
          "$APP_EXEC" >"$RUNNER_TEMP/xpst-app.log" 2>&1 &
          APP_PID=$!
          cleanup() {
            kill "$APP_PID" 2>/dev/null || true
            wait "$APP_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          for _ in $(seq 1 15); do
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              echo "::error::App exited during smoke boot"
              exit 1
            fi
            sleep 1
          done
          echo "PASS: xPST.app stayed alive for 15s"

      - name: Stage macOS DMG artifacts
        run: |
          set -euo pipefail
          APP_PATH="$(find src-tauri/target -type d -path '*/release/bundle/macos/xPST.app' -print -quit)"
          DMG_PATH="$(find src-tauri/target -type f -path '*/release/bundle/dmg/*.dmg' -print -quit)"
          test -n "$APP_PATH"
          test -n "$DMG_PATH"
          hdiutil verify "$DMG_PATH"
          rm -rf release-artifacts
          mkdir -p release-artifacts
          cp "$DMG_PATH" release-artifacts/xPST.dmg
          (cd release-artifacts && shasum -a 256 xPST.dmg > SHA256SUMS)
          shasum -a 256 -c release-artifacts/SHA256SUMS

      - name: Upload macOS DMG artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xPST-${{ matrix.target }}-dmg
          path: |
            release-artifacts/xPST.dmg
            release-artifacts/SHA256SUMS
          if-no-files-found: error

      - name: Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/xPST.dmg
            release-artifacts/SHA256SUMS
          generate_release_notes: true
          draft: false
