name: Tauri Shell Release

# Builds the Tauri 2 desktop shell (xPST.app) with the Python engine sidecar.
# Triggers on version tags (v*) and manual dispatch. Artifacts: .app, .dmg,
# updater (.app.tar.gz + .sig). Notarization runs only when Apple secrets exist.

on:
  push:
    tags:
      - "v*.*.*"
    paths:
      - "src-tauri/**"
      - "ui/**"
      - "build_engine.spec"
      - "scripts/build-engine.sh"
      - "scripts/verify_release_version.py"
      - "pyproject.toml"
      - ".github/workflows/tauri-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tauri-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: "app,dmg"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Verify release version
        run: python scripts/verify_release_version.py

      - name: Build Svelte UI
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Install Python engine deps (sidecar build)
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[full]" pyinstaller

      - name: Build engine sidecar (PyInstaller onedir)
        run: |
          scripts/build-engine.sh
          test -f ui/dist/index.html
          test -x src-tauri/binaries/engine/xpst-engine
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"

      - name: Fetch media binaries (ffmpeg/ffprobe/yt-dlp)
        run: |
          chmod +x scripts/fetch-media-binaries.sh
          scripts/fetch-media-binaries.sh

      - name: Import Apple signing cert (if secrets present)
        if: env.APPLE_CERTIFICATE != null && env.APPLE_CERTIFICATE != ''
        id: cert
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.11.4 --locked

      - name: Build Tauri app + updater artifacts
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          export TAURI_SIGNING_PRIVATE_KEY="${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}"
          export TAURI_SIGNING_PRIVATE_KEY_PASSWORD="${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}"
          # An empty Apple signing/notarization variable is NOT the same as an
          # absent one: Tauri treats a set-but-empty APPLE_SIGNING_IDENTITY as an
          # identity named "" and every bundle fails with
          # `codesign: no identity found`. The repository has no Apple secrets,
          # so drop the variables instead of passing empty strings.
          for var in APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID APPLE_CERTIFICATE; do
            if [ -z "${!var:-}" ]; then
              unset "$var" || true
            fi
          done
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            # CI key present → signed updater artifacts
            cargo tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
          else
            # No updater key → still build every configured bundle (the .dmg a
            # stranger downloads) with Tauri's default ad-hoc signing. Building
            # `app` only here silently produced no installer at all.
            echo "no TAURI_SIGNING_PRIVATE_KEY: building ${{ matrix.bundles }} with ad-hoc signing"
            cargo tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
          fi
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Assert the installer bundles exist
        run: |
          set -euo pipefail
          echo "--- bundles under src-tauri/target ---"
          find src-tauri/target -path '*bundle*' \( -name '*.dmg' -o -name '*.app' -o -name '*.exe' -o -name '*.msi' -o -name '*.deb' -o -name '*.AppImage' \) -print
          case "${RUNNER_OS}" in
            macOS)
              if [ -z "$(find src-tauri/target -path '*bundle/dmg*' -name '*.dmg' -print -quit)" ]; then
                echo "::error::no .dmg was produced; the macOS lane cannot publish a stranger installer"
                exit 1
              fi
              ;;
            Windows)
              if [ -z "$(find src-tauri/target -path '*bundle*' \( -name '*.exe' -o -name '*.msi' \) -print -quit)" ]; then
                echo "::error::no Windows installer was produced"
                exit 1
              fi
              ;;
            Linux)
              if [ -z "$(find src-tauri/target -path '*bundle*' \( -name '*.deb' -o -name '*.AppImage' \) -print -quit)" ]; then
                echo "::error::no Linux package was produced"
                exit 1
              fi
              ;;
          esac

      - name: Verify bundle size gate (≤200MB)
        run: |
          APP_PATH=$(find src-tauri/target -name "xPST.app" -path "*release*" | head -1)
          SIZE_MB=$(du -sm "$APP_PATH" | cut -f1)
          echo "xPST.app size: ${SIZE_MB}MB"
          if [ "$SIZE_MB" -gt 200 ]; then
            echo "::error::Bundle ${SIZE_MB}MB exceeds 200MB gate"
            exit 1
          fi

      - name: Smoke boot (app launches, engine healthy)
        if: runner.os == 'macOS'
        run: |
          APP_PATH=$(find src-tauri/target -name "xPST.app" -path "*release*" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::no xPST.app bundle to smoke"
            exit 1
          fi
          set -e
          # macOS ships no GNU `timeout`, so bound the wait with a watchdog
          # instead of `timeout 60 ...`.
          BIN=$(ls "$APP_PATH/Contents/MacOS/"*)
          LOG="$RUNNER_TEMP/xpst-smoke-boot.log"
          "$BIN" > "$LOG" 2>&1 &
          APP_PID=$!
          sleep 15
          if ! kill -0 $APP_PID 2>/dev/null; then
            echo "::error::App exited during smoke boot"
            cat "$LOG"
            exit 1
          fi
          kill $APP_PID 2>/dev/null || true
          echo "--- smoke boot log (first 40 lines) ---"
          head -40 "$LOG" || true

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: xPST-${{ matrix.target }}
          # A --target build lands under target/<triple>/release/bundle, so the
          # old literal target/release/bundle paths matched nothing and the
          # upload failed with "no files found" even for a successful build.
          path: |
            src-tauri/target/**/bundle/macos/xPST.app
            src-tauri/target/**/bundle/macos/*.app.tar.gz
            src-tauri/target/**/bundle/macos/*.app.tar.gz.sig
            src-tauri/target/**/bundle/dmg/*.dmg
            src-tauri/target/**/bundle/nsis/*.exe
            src-tauri/target/**/bundle/msi/*.msi
            src-tauri/target/**/bundle/deb/*.deb
            src-tauri/target/**/bundle/appimage/*.AppImage
          if-no-files-found: error

      - name: Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/**/bundle/macos/*.app.tar.gz
            src-tauri/target/**/bundle/macos/*.app.tar.gz.sig
            src-tauri/target/**/bundle/dmg/*.dmg
            src-tauri/target/**/bundle/nsis/*.exe
            src-tauri/target/**/bundle/msi/*.msi
            src-tauri/target/**/bundle/deb/*.deb
            src-tauri/target/**/bundle/appimage/*.AppImage
          generate_release_notes: true
          draft: false
