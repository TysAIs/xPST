name: Tauri Shell Release

# Builds the Tauri 2 desktop shell with the Python engine sidecar from the SAME
# source for every supported desktop platform:
#
#   macOS   aarch64-apple-darwin     -> xPST.app + .dmg
#   Windows x86_64-pc-windows-msvc   -> NSIS setup .exe + WiX .msi
#   Linux   x86_64-unknown-linux-gnu -> .deb + .AppImage
#
# Triggers on version tags (v*) and manual dispatch.
#
# Lane order (identical on all three platforms): sidecar + media binaries ->
# Tauri bundles -> ASSERT the expected installer exists -> installer size gate
# -> upload the bundle -> smoke boot. The assert step makes a lane fail loudly
# instead of uploading nothing when a build produced no installer.
#
# Signing is optional and never silently changes WHAT gets built:
#   - macOS: notarization only when the Apple secrets exist. A set-but-empty
#     Apple variable is unset before the build because Tauri treats an empty
#     APPLE_SIGNING_IDENTITY as an identity named "" and every bundle then dies
#     with `codesign: no identity found`.
#   - All lanes: when no updater signing key is present the lane still builds
#     its full configured bundle set (createUpdaterArtifacts is false in
#     src-tauri/tauri.conf.json), with Tauri's default/ad-hoc signing.

on:
  push:
    tags:
      - "v*.*.*"
      # Documented dry-run tag lane: pushing e.g. `dryrun-tauri-1` builds and
      # smoke-tests exactly what a real tag builds, uploads the assets into a
      # DRAFT release (nothing is published, no watcher is notified) and is
      # ignored by the legacy release.yml lane. Used to prove the tag path
      # without publishing a release - see docs/tauri-release-lane.md.
      - "dryrun-tauri-*"
    # NOTE: no `paths:` filter here on purpose. GitHub does not evaluate path
    # filters for tag pushes, and on this workflow a filter would also be
    # misleading: the lane must run for EVERY version tag or a tag can silently
    # produce no artifact at all.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tauri-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: "app,dmg"
            engine_binary: xpst-engine
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: "nsis,msi"
            engine_binary: xpst-engine.exe
          # Pinned to 22.04: the AppImage bundler needs libfuse2, which is
          # absent from ubuntu-24.04 (ubuntu-latest) images.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: "deb,appimage"
            engine_binary: xpst-engine
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        # Git Bash on Windows so the POSIX steps below run identically on all
        # three lanes instead of needing a pwsh copy of every command.
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Verify release version
        run: python scripts/verify_release_version.py

      - name: Build Svelte UI
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: UI contracts (node --test)
        working-directory: ui
        run: npm test

      - name: Install Linux system dependencies (Tauri v2 + AppImage)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            build-essential \
            curl wget file unzip \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            xvfb

      - name: "Guard: Linux prerequisites really present"
        if: runner.os == 'Linux'
        run: |
          # pkg-config lookups the Tauri build script relies on. Failing here
          # gives a named prerequisite instead of a cryptic webkit2gtk error.
          pkg-config --exists webkit2gtk-4.1 && echo "webkit2gtk-4.1: present" \
            || { echo "::error::libwebkit2gtk-4.1-dev missing"; exit 1; }
          command -v patchelf >/dev/null || { echo "::error::patchelf missing"; exit 1; }
          command -v xvfb-run >/dev/null || { echo "::error::xvfb missing"; exit 1; }

      - name: Install Python engine deps (sidecar build)
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[full]" pyinstaller

      - name: Build engine sidecar (PyInstaller onedir)
        run: |
          set -euo pipefail
          # scripts/build-engine.sh is POSIX and handles Windows itself (it
          # picks the .exe suffix and takes its interpreter from PYTHON).
          PYTHON="$(command -v python3 || command -v python)"
          export PYTHON
          echo "using PYTHON=$PYTHON"
          scripts/build-engine.sh
          test -f ui/dist/index.html || { echo "::error::ui/dist/index.html missing"; exit 1; }
          ENGINE_BIN="src-tauri/binaries/engine/${{ matrix.engine_binary }}"
          test -f "$ENGINE_BIN" || {
            echo "::error::engine sidecar not found at $ENGINE_BIN (target ${{ matrix.target }})"
            ls -la src-tauri/binaries/engine || true
            exit 1
          }
          if [ "${RUNNER_OS}" != "Windows" ]; then
            test -x "$ENGINE_BIN" || { echo "::error::$ENGINE_BIN is not executable"; exit 1; }
          fi
          echo "engine sidecar OK: $ENGINE_BIN ($(du -sh src-tauri/binaries/engine | cut -f1))"
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"

      - name: Fetch bundled media binaries (yt-dlp only)
        run: |
          set -euo pipefail
          chmod +x scripts/fetch-media-binaries.sh
          # ffmpeg/ffprobe are NOT bundled any more (~87MB of a 192MB app): the
          # engine prefers a system ffmpeg and otherwise fetches a pinned,
          # checksum-verified static build on first use. Only yt-dlp still ships,
          # and the engine's bundled yt_dlp module is the primary path, so a
          # failed yt-dlp fetch is a warning rather than a lane failure.
          case "${RUNNER_OS}" in
            macOS)   PLATFORM=macos-arm64 ;;
            Linux)   PLATFORM=linux-x64 ;;
            Windows) PLATFORM=win-x64 ;;
            *) echo "::error::unsupported runner OS ${RUNNER_OS}"; exit 1 ;;
          esac
          scripts/fetch-media-binaries.sh "$PLATFORM"
          if [ "${RUNNER_OS}" = "Windows" ]; then
            YTDLP=src-tauri/binaries/ytdlp/yt-dlp.exe
          else
            YTDLP=src-tauri/binaries/ytdlp/yt-dlp
          fi
          if [ -e "$YTDLP" ]; then
            echo "yt-dlp bundled: $YTDLP ($(du -sh "$YTDLP" | cut -f1))"
          else
            echo "::warning::$YTDLP was not fetched; the engine's bundled yt_dlp module still works"
          fi
          test ! -e src-tauri/binaries/ffmpeg/ffmpeg || {
            echo "::error::an ffmpeg binary reappeared in the bundle inputs — it must not be bundled"
            exit 1
          }

      - name: Assert the bundled media binaries are pinned and checksummed
        run: |
          set -euo pipefail
          # scripts/fetch-media-binaries.sh verifies every download against the
          # SHA-256 in scripts/media-binaries.lock and writes this record; the
          # checker fails on a missing record, a missing artifact, or an
          # UNPINNED entry (XPST_ALLOW_UNPINNED_MEDIA=1 dev escape hatch).
          scripts/verify-media-binaries-provenance.sh src-tauri/binaries/PROVENANCE.txt src-tauri/binaries
          # Keep a per-target copy where the artifact upload can pick it up, so
          # the provenance record travels to the release with this lane's
          # installers (src-tauri/target is a build dir and is gitignored).
          mkdir -p src-tauri/target
          cp src-tauri/binaries/PROVENANCE.txt "src-tauri/target/media-binaries-PROVENANCE-${{ matrix.target }}.txt"
          {
            echo "### Media binary provenance (${{ matrix.target }})"
            echo '```'
            cat src-tauri/binaries/PROVENANCE.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Import Apple signing cert (if secrets present)
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != null && env.APPLE_CERTIFICATE != ''
        id: cert
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}

      - name: Shell unit tests (cargo test)
        # Runs the shell's own tests, including the capability/ACL contract that
        # proves the engine origin is granted the dialog command on whatever
        # loopback port the app picks at launch. Deliberately placed after the
        # UI build and the resource fetch: the test harness compiles the same
        # generate_context!() the app does, and that needs both present.
        working-directory: src-tauri
        run: cargo test

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.11.4 --locked

      - name: Build Tauri app + bundles
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          export TAURI_SIGNING_PRIVATE_KEY="${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}"
          export TAURI_SIGNING_PRIVATE_KEY_PASSWORD="${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}"
          if [ "${RUNNER_OS}" = "macOS" ]; then
            # An empty Apple signing/notarization variable is NOT the same as an
            # absent one: Tauri treats a set-but-empty APPLE_SIGNING_IDENTITY as
            # an identity named "" and every bundle fails with
            # `codesign: no identity found`. The repository has no Apple
            # secrets, so drop the variables instead of passing empty strings.
            for var in APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID APPLE_CERTIFICATE; do
              if [ -z "${!var:-}" ]; then
                unset "$var" || true
              fi
            done
          fi
          # Build the configured bundle set whether or not an updater key is
          # present. Downgrading the list to `app` here silently produced no
          # installer at all; createUpdaterArtifacts is false in
          # tauri.conf.json, so an absent key simply means ad-hoc signing.
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            # Signed release build. The committed config keeps
            # bundle.createUpdaterArtifacts=false so a plain local
            # `cargo tauri build` never demands a key; this lane flips it on for
            # exactly this build through a config overlay, which is what emits
            # the updater packages the manifest points at (macOS .app.tar.gz,
            # Windows *.nsis.zip, Linux *.AppImage.tar.gz) plus their .sig
            # sidecars.
            echo "updater signing key present: building ${{ matrix.bundles }} with signed updater artifacts"
            cargo tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} \
              --config '{"bundle":{"createUpdaterArtifacts":true}}'
          else
            echo "no TAURI_SIGNING_PRIVATE_KEY: building ${{ matrix.bundles }} with Tauri's default ad-hoc signing"
            cargo tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
          fi
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Assert the expected installer was produced
        run: |
          set -euo pipefail
          echo "--- installer-like bundles under src-tauri/target ---"
          find src-tauri/target -path '*bundle*' -type f \
            \( -name '*.dmg' -o -name '*.exe' -o -name '*.msi' \
               -o -name '*.deb' -o -name '*.AppImage' \) -print || true
          case "${RUNNER_OS}" in
            macOS)
              INSTALLER=$(find src-tauri/target -type f -path '*bundle/dmg/*.dmg' -print -quit)
              [ -n "$INSTALLER" ] || {
                echo "::error::no .dmg was produced; the macOS lane cannot publish a stranger installer (target ${{ matrix.target }}, bundles ${{ matrix.bundles }})"
                exit 1
              }
              ;;
            Windows)
              INSTALLER=$(find src-tauri/target -type f \
                \( -path '*bundle/nsis/*.exe' -o -path '*bundle/msi/*.msi' \) -print -quit)
              [ -n "$INSTALLER" ] || {
                echo "::error::Windows lane produced no NSIS .exe or .msi installer (target ${{ matrix.target }}, bundles ${{ matrix.bundles }})"
                exit 1
              }
              ;;
            Linux)
              INSTALLER=$(find src-tauri/target -type f \
                \( -path '*bundle/deb/*.deb' -o -path '*bundle/appimage/*.AppImage' \) -print -quit)
              [ -n "$INSTALLER" ] || {
                echo "::error::Linux lane produced no .deb or .AppImage installer (target ${{ matrix.target }}, bundles ${{ matrix.bundles }})"
                exit 1
              }
              ;;
            *)
              echo "::error::unsupported runner ${RUNNER_OS}"
              exit 1
              ;;
          esac
          echo "expected installer present: $INSTALLER"

      - name: Verify app/installer size budget
        run: |
          set -euo pipefail
          # Budgets after unbundling ffmpeg (it was 87MB of a 192MB app):
          # the unpacked macOS .app must stay <= 140MB, the installer a stranger
          # downloads <= 160MB. Both are hard failures now — the unpacked app
          # size is the number this budget exists to protect, and the previous
          # version only warned about it (so 87MB of ffmpeg could ride along
          # unnoticed).
          APP_BUDGET_MB=140
          INSTALLER_BUDGET_MB=160
          case "${RUNNER_OS}" in
            macOS)   PATTERN='*bundle/dmg/*.dmg' ;;
            Windows) PATTERN='*bundle/nsis/*.exe' ;;
            Linux)   PATTERN='*bundle/appimage/*.AppImage' ;;
            *) echo "::error::unsupported runner ${RUNNER_OS}"; exit 1 ;;
          esac
          INSTALLER=$(find src-tauri/target -path "$PATTERN" -print -quit)
          # Fall back to the other configured bundle type when the preferred one
          # was not produced; the assert step above guarantees an installer
          # exists, so this only chooses which one to measure.
          if [ -z "$INSTALLER" ]; then
            case "${RUNNER_OS}" in
              Windows) PATTERN='*bundle/msi/*.msi' ;;
              Linux)   PATTERN='*bundle/deb/*.deb' ;;
            esac
            INSTALLER=$(find src-tauri/target -path "$PATTERN" -print -quit)
          fi
          [ -n "$INSTALLER" ] || { echo "::error::no installer matched ${PATTERN}"; exit 1; }
          BYTES=$(wc -c < "$INSTALLER" | tr -d ' ')
          SIZE_MB=$((BYTES / 1048576))
          echo "installer (what a stranger downloads): ${INSTALLER} -> ${SIZE_MB}MB (${BYTES} bytes)"

          FAILED=0
          if [ "${RUNNER_OS}" = "macOS" ]; then
            APP_PATH=$(find src-tauri/target -type d -name "xPST.app" -path "*release*" -print -quit || true)
            if [ -n "${APP_PATH}" ]; then
              APP_MB=$(du -sm "$APP_PATH" | cut -f1)
              echo "unpacked app bundle: ${APP_PATH} -> ${APP_MB}MB (budget ${APP_BUDGET_MB}MB)"
              # The bundle must not carry an ffmpeg/ffprobe binary at all.
              BUNDLED_MEDIA=$(find "$APP_PATH" -type f \( -name 'ffmpeg' -o -name 'ffprobe' -o -name 'ffmpeg.exe' -o -name 'ffprobe.exe' \) -print || true)
              if [ -n "$BUNDLED_MEDIA" ]; then
                echo "::error::ffmpeg/ffprobe is bundled again (must be resolved at runtime):"
                echo "$BUNDLED_MEDIA"
                FAILED=1
              fi
              if [ "$APP_MB" -gt "$APP_BUDGET_MB" ]; then
                echo "::error::unpacked xPST.app is ${APP_MB}MB, over the ${APP_BUDGET_MB}MB budget"
                FAILED=1
              fi
              # A build that lost its engine would also be small: assert the
              # engine is really there before crediting the size win.
              ENGINE_BIN="$APP_PATH/Contents/Resources/binaries/engine/xpst-engine"
              if [ ! -f "$ENGINE_BIN" ]; then
                echo "::error::engine sidecar missing from the app bundle ($ENGINE_BIN)"
                FAILED=1
              fi
            else
              echo "::error::no xPST.app found to measure"
              FAILED=1
            fi
          fi
          if [ "$SIZE_MB" -gt "$INSTALLER_BUDGET_MB" ]; then
            echo "::error::installer ${SIZE_MB}MB exceeds the ${INSTALLER_BUDGET_MB}MB budget"
            FAILED=1
          fi
          [ "$FAILED" -eq 0 ] || exit 1
          echo "size budget: PASS (installer ${SIZE_MB}MB <= ${INSTALLER_BUDGET_MB}MB)"

      - name: Upload installers (per target)
        uses: actions/upload-artifact@v4
        with:
          name: xPST-${{ matrix.target }}
          # A --target build lands under target/<triple>/release/bundle, so a
          # literal target/release/bundle path matches nothing. Glob it, and
          # cover every bundle type so this single step serves all three lanes.
          path: |
            src-tauri/target/**/bundle/macos/xPST.app
            src-tauri/target/**/bundle/macos/*.app.tar.gz
            src-tauri/target/**/bundle/macos/*.app.tar.gz.sig
            src-tauri/target/**/bundle/dmg/*.dmg
            src-tauri/target/**/bundle/nsis/*.exe
            src-tauri/target/**/bundle/nsis/*.nsis.zip
            src-tauri/target/**/bundle/nsis/*.nsis.zip.sig
            src-tauri/target/**/bundle/msi/*.msi
            src-tauri/target/**/bundle/appimage/*.AppImage
            src-tauri/target/**/bundle/appimage/*.AppImage.tar.gz
            src-tauri/target/**/bundle/appimage/*.AppImage.tar.gz.sig
            src-tauri/target/**/bundle/deb/*.deb
            src-tauri/target/media-binaries-PROVENANCE-*.txt
          if-no-files-found: error

      - name: "Cold-boot measurement + budget gate (macOS)"
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          APP_PATH=$(find src-tauri/target -type d -path "*release*" -name "xPST.app" -print -quit)
          test -n "$APP_PATH" || { echo "::error::xPST.app not found — the boot gate would have silently no-op'd"; exit 1; }
          # This replaces the old "launch it and sleep 15s" smoke: reaching
          # BOOT_TO_READY_SECS already proves the app came up AND that the engine
          # sidecar answered /health, and the harness additionally asserts the
          # sidecar is reaped on exit (no leftover xpst-engine). The numbers are
          # then enforced against perf/boot-budget.json, so a startup regression
          # fails the lane that publishes bundles instead of shipping quietly.
          python scripts/measure_boot.py \
            --app "$APP_PATH" \
            --runs 3 \
            --json-out "$RUNNER_TEMP/boot-samples.json" | tee "$RUNNER_TEMP/boot-report.txt"

      - name: "Upload cold-boot samples (macOS)"
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: boot-samples-${{ github.run_id }}-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/boot-samples.json
            ${{ runner.temp }}/boot-report.txt
          if-no-files-found: warn

      - name: "Smoke boot (Linux) — the real .AppImage runs under xvfb with the engine sidecar"
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          APPIMAGE=$(find src-tauri/target -type f -path '*bundle/appimage/*.AppImage' -print -quit)
          if [ -z "$APPIMAGE" ]; then
            DEB=$(find src-tauri/target -type f -path '*bundle/deb/*.deb' -print -quit)
            echo "::error::no .AppImage to smoke (deb=${DEB:-none})"
            exit 1
          fi
          chmod +x "$APPIMAGE"
          # Container/VM friendly WebKitGTK: the DMABUF renderer crashes on CI
          # runners with no GPU.
          export WEBKIT_DISABLE_COMPOSITING_MODE=1
          export WEBKIT_DISABLE_DMABUF_RENDERER=1

          # First try a real FUSE mount (what a desktop user gets). GitHub's
          # runner VMs do not always have a working /dev/fuse + fusermount, so
          # fall back to the AppImage runtime's own extraction mode, which runs
          # the same payload and still exports APPDIR for resource lookup.
          smoke_once() {  # $1 = log file
            local log="$1"
            xvfb-run -a "$APPIMAGE" > "$log" 2>&1 &
            local pid=$!
            local up=0
            for _ in $(seq 1 45); do
              sleep 1
              if ! kill -0 "$pid" 2>/dev/null; then
                return 1
              fi
              if pgrep -f 'xpst-engine' >/dev/null 2>&1; then up=1; break; fi
            done
            pkill -f 'xpst-engine' 2>/dev/null || true
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            [ "$up" -eq 1 ]
          }

          if smoke_once "$RUNNER_TEMP/xpst-smoke-fuse.log"; then
            echo "PASS: .AppImage FUSE-mounted, app alive, engine sidecar running"
          else
            echo "--- FUSE-mount attempt did not boot; output follows ---"
            cat "$RUNNER_TEMP/xpst-smoke-fuse.log" || true
            export APPIMAGE_EXTRACT_AND_RUN=1
            if smoke_once "$RUNNER_TEMP/xpst-smoke-extract.log"; then
              echo "PASS: .AppImage extract-and-run, app alive, engine sidecar running"
              echo "(FUSE mount unavailable on this runner; the payload ran anyway)"
            else
              echo "::error::.AppImage did not boot under either a FUSE mount or extract-and-run"
              cat "$RUNNER_TEMP/xpst-smoke-extract.log" || true
              exit 1
            fi
          fi

      - name: "Smoke boot (Windows) — silent-install the NSIS setup, launch, engine sidecar alive"
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $nsis = (Get-ChildItem -Recurse -Path src-tauri/target -Filter *.exe |
                   Where-Object { $_.FullName -match 'bundle\\nsis\\' } |
                   Select-Object -First 1).FullName
          if (-not $nsis) { Write-Error 'no NSIS installer to smoke'; exit 1 }
          Write-Host "installing $nsis silently"
          Start-Process -FilePath $nsis -ArgumentList '/S' -Wait
          $dir = Join-Path $env:LOCALAPPDATA 'xPST'
          $exe = Join-Path $dir 'xPST.exe'
          if (-not (Test-Path $exe)) {
            Write-Host 'installed tree:'
            Get-ChildItem $dir -Recurse -ErrorAction SilentlyContinue | Select-Object FullName
            Write-Error "installed exe not found at $exe"
            exit 1
          }
          $proc = Start-Process -FilePath $exe -PassThru
          $engine = $false
          for ($i = 0; $i -lt 45; $i++) {
            Start-Sleep -Seconds 1
            if ($proc.HasExited) { Write-Error 'app exited before the engine became reachable'; exit 1 }
            if (Get-Process -Name 'xpst-engine' -ErrorAction SilentlyContinue) { $engine = $true; break }
          }
          if (-not $engine) { Write-Error 'engine sidecar never appeared within 45s'; exit 1 }
          Write-Host 'PASS: installed xPST alive and engine sidecar running'
          Stop-Process -Name 'xpst-engine' -ErrorAction SilentlyContinue
          Stop-Process -Id $proc.Id -ErrorAction SilentlyContinue

  # Tag builds only: ONE job owns the GitHub release.
  #
  # Previously each of the three lanes uploaded straight to the release, so all
  # three raced to create it and a tag build could die on the API's 5xx during
  # that race (observed on dryrun-tauri-1: "Creating new GitHub release ... 500 /
  # Too many retries"). Collecting the per-lane artifacts here means the release
  # is created once, the published asset set is asserted before anything is
  # published, and the aggregate checksums cover every lane's installer.
  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-tauri]
    runs-on: ubuntu-latest
    steps:
      - name: Download the per-lane artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Resolve and assert the release asset set
        id: assets
        run: |
          set -euo pipefail
          echo "--- artifacts collected from every lane ---"
          find release-artifacts -type f | sort
          # A tag that publishes zero files is worse than a red lane: it looks
          # shipped. Require the file a stranger installs for every platform
          # this workflow claims to support, plus each lane's provenance record.
          FILES=()
          while IFS= read -r f; do [ -n "$f" ] && FILES+=("$f"); done < <(find release-artifacts -type f \
            \( -name '*.dmg' -o -name '*.exe' -o -name '*.msi' -o -name '*.deb' \
               -o -name '*.AppImage' -o -name '*.AppImage.tar.gz' \
               -o -name '*.app.tar.gz' -o -name '*.nsis.zip' -o -name '*.sig' \
               -o -name 'media-binaries-PROVENANCE-*.txt' \) | sort)
          require() {  # $1 = description, rest = acceptable shell globs
            local desc="$1"; shift
            local f pattern
            for f in "${FILES[@]}"; do
              for pattern in "$@"; do
                # shellcheck disable=SC2053 - the glob is intended on the right
                if [[ "$f" == $pattern ]]; then
                  echo "ok: $desc -> $f"
                  return 0
                fi
              done
            done
            echo "::error::tag $GITHUB_REF_NAME would publish no $desc"
            exit 1
          }
          require "macOS installer (.dmg)" '*.dmg'
          require "Windows installer (.exe or .msi)" '*.exe' '*.msi'
          require "Linux installer (.AppImage or .deb)" '*.AppImage' '*.deb'
          require "media binary provenance record" '*media-binaries-PROVENANCE-*.txt'
          # Checksums for exactly the assets being published. Asset names are
          # flattened to their basename because that is the name GitHub gives
          # them, so `sha256sum -c SHA256SUMS` works on a downloaded set.
          ( cd release-artifacts && for rel in $(printf '%s\n' "${FILES[@]}" | sed 's#^release-artifacts/##' | sort); do
              printf '%s  %s\n' "$(sha256sum "$rel" | cut -d' ' -f1)" "$(basename "$rel")"
            done ) > release-artifacts/SHA256SUMS
          echo "--- SHA256SUMS ---"
          cat release-artifacts/SHA256SUMS
          FILES+=(release-artifacts/SHA256SUMS)
          {
            echo 'files<<RELEASE_ASSETS_EOF'
            printf '%s\n' "${FILES[@]}"
            echo 'RELEASE_ASSETS_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          # The asset list was resolved and asserted in the step above: no glob
          # here can quietly match zero files.
          files: ${{ steps.assets.outputs.files }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          # Version tags (vX.Y.Z) publish; a documented dry-run tag
          # (dryrun-tauri-*) exercises the exact same build, smoke, assert and
          # upload path into a DRAFT release, so the tag lane can be proven
          # without publishing anything.
          draft: ${{ !startsWith(github.ref_name, 'v') }}
          prerelease: false
  publish-updater-manifest:
    # Wires the ONE updater manifest generator into the release lane.
    #
    # scripts/gen-updater-manifest.py is the single authority for latest.json in
    # this repository (the same script `.github/workflows/publish-updater.yml`
    # runs). There is deliberately no second generator: two scripts writing the
    # same manifest is how a release ends up advertising a platform it never
    # built, or a signature that does not match the configured pubkey.
    #
    # This job only ASSEMBLES and VALIDATES the manifest for the platforms this
    # run actually produced a signed artifact for, and attaches it to the
    # tagged release as `latest.json` (which is what makes the Release-asset
    # fallback endpoint work). Committing `updates/latest.json` to the Pages
    # root stays the single responsibility of publish-updater.yml.
    #
    # A run with no signing key produces no `.sig`, so the job reports the
    # channel as blocked and succeeds — it never invents a signature.
    needs: build-tauri
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # The three lanes upload under `xPST-<target>`; merge them into one flat
      # directory because the selector resolves one signed artifact per target
      # from a directory listing.
      - uses: actions/download-artifact@v4
        with:
          path: updater-assets
          merge-multiple: true

      - name: Flatten the updater-relevant files
        run: |
          set -euo pipefail
          mkdir -p updater-flat
          # download-artifact keeps the path the lane uploaded under, so a
          # recursive copy of just the updater-shaped files gives the selector
          # the flat directory it expects. The unpacked *.app tree is skipped on
          # purpose: only the .tar.gz/.zip packages carry a signature.
          find updater-assets -type f \
            \( -name '*.app.tar.gz' -o -name '*.app.tar.gz.sig' \
               -o -name '*.nsis.zip' -o -name '*.nsis.zip.sig' \
               -o -name '*.AppImage' -o -name '*.AppImage.tar.gz' \
               -o -name '*.AppImage.tar.gz.sig' -o -name '*setup.exe' \
               -o -name '*.msi' -o -name '*.msi.sig' \) \
            -exec cp {} updater-flat/ \;
          find updater-flat -type f -print | sort

      - name: Select one signed artifact per target
        id: select
        run: |
          set -euo pipefail
          python3 scripts/select-updater-artifacts.py \
            --dir updater-flat \
            --report "$RUNNER_TEMP/updater-artifacts.json" \
            --args-file "$RUNNER_TEMP/updater-artifact-args.txt" \
            --github-output "$GITHUB_OUTPUT"

      - name: Generate and validate updates/latest.json (the one generator)
        id: manifest
        if: steps.select.outputs.found != '' && steps.select.outputs.found != '0'
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/latest.json"
          args=()
          while IFS= read -r entry; do
            [[ -n "$entry" ]] || continue
            args+=(--platform "${entry%%=*}" --artifact "$entry")
          done < "$RUNNER_TEMP/updater-artifact-args.txt"
          python3 scripts/gen-updater-manifest.py \
            --version "${GITHUB_REF_NAME#v}" \
            --notes "xPST ${GITHUB_REF_NAME} desktop release - see the GitHub release notes." \
            --base-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME" \
            --output "$manifest" \
            --config src-tauri/tauri.conf.json \
            --pub-date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "${args[@]}"
          # Same staging/validation script the publish workflow uses, so the
          # bytes that reach a release asset are the bytes that reach Pages.
          scripts/publish-updater.sh --manifest "$manifest" --site-dir "$GITHUB_WORKSPACE"
          test -s "$GITHUB_WORKSPACE/updates/latest.json"
          printf 'manifest=%s\n' "$manifest" >> "$GITHUB_OUTPUT"

      - name: Attach latest.json to the release
        if: steps.manifest.outputs.manifest != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          MANIFEST: ${{ steps.manifest.outputs.manifest }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "$MANIFEST#latest.json" \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Report the updater channel state
        if: always()
        env:
          FOUND: ${{ steps.select.outputs.found }}
          PLATFORMS: ${{ steps.select.outputs.platforms }}
          MISSING: ${{ steps.select.outputs.missing }}
        run: |
          set -euo pipefail
          {
            echo "## Updater manifest"
            echo
            echo "- release tag: ${GITHUB_REF_NAME}"
            echo "- publishable platforms: ${PLATFORMS:-<none>}"
            echo "- platforms without a signed artifact: ${MISSING:-<none>}"
            if [[ "${FOUND:-0}" == "0" ]]; then
              echo
              echo "No signed updater artifact was produced, so no manifest was written. That is"
              echo "expected while the repository has no \`TAURI_SIGNING_PRIVATE_KEY\` secret: a"
              echo "Tauri build without the key emits no \`.sig\`, and the manifest must never invent one."
            else
              echo
              echo "\`latest.json\` was attached to ${GITHUB_REF_NAME}; \`publish-updater.yml\`"
              echo "commits the same manifest to the Pages root on \`main\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
