name: Tauri Shell Release

# Builds the Tauri 2 desktop shell with the Python engine sidecar from the SAME
# source for every supported desktop platform:
#
#   macOS   aarch64-apple-darwin     -> xPST.app + .dmg
#   Windows x86_64-pc-windows-msvc   -> NSIS setup .exe + WiX .msi
#   Linux   x86_64-unknown-linux-gnu -> .deb + .AppImage
#
# Triggers on version tags (v*) and manual dispatch.
#
# Lane order (identical on all three platforms): sidecar + media binaries ->
# Tauri bundles -> ASSERT the expected installer exists -> installer size gate
# -> upload the bundle -> smoke boot. The assert step makes a lane fail loudly
# instead of uploading nothing when a build produced no installer.
#
# Signing is optional and never silently changes WHAT gets built:
#   - macOS: notarization only when the Apple secrets exist. A set-but-empty
#     Apple variable is unset before the build because Tauri treats an empty
#     APPLE_SIGNING_IDENTITY as an identity named "" and every bundle then dies
#     with `codesign: no identity found`.
#   - All lanes: when no updater signing key is present the lane still builds
#     its full configured bundle set (createUpdaterArtifacts is false in
#     src-tauri/tauri.conf.json), with Tauri's default/ad-hoc signing.

on:
  push:
    tags:
      - "v*.*.*"
      # Documented dry-run tag lane: pushing e.g. `dryrun-tauri-1` builds and
      # smoke-tests exactly what a real tag builds, uploads the assets into a
      # DRAFT release (nothing is published, no watcher is notified) and is
      # ignored by the legacy release.yml lane. Used to prove the tag path
      # without publishing a release - see docs/tauri-release-lane.md.
      - "dryrun-tauri-*"
    # NOTE: no `paths:` filter here on purpose. GitHub does not evaluate path
    # filters for tag pushes, and on this workflow a filter would also be
    # misleading: the lane must run for EVERY version tag or a tag can silently
    # produce no artifact at all.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tauri-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: "app,dmg"
            engine_binary: xpst-engine
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: "nsis,msi"
            engine_binary: xpst-engine.exe
          # Pinned to 22.04: the AppImage bundler needs libfuse2, which is
          # absent from ubuntu-24.04 (ubuntu-latest) images.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: "deb,appimage"
            engine_binary: xpst-engine
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        # Git Bash on Windows so the POSIX steps below run identically on all
        # three lanes instead of needing a pwsh copy of every command.
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Verify release version
        run: python scripts/verify_release_version.py

      - name: Build Svelte UI
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Install Linux system dependencies (Tauri v2 + AppImage)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            build-essential \
            curl wget file unzip \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            xvfb

      - name: "Guard: Linux prerequisites really present"
        if: runner.os == 'Linux'
        run: |
          # pkg-config lookups the Tauri build script relies on. Failing here
          # gives a named prerequisite instead of a cryptic webkit2gtk error.
          pkg-config --exists webkit2gtk-4.1 && echo "webkit2gtk-4.1: present" \
            || { echo "::error::libwebkit2gtk-4.1-dev missing"; exit 1; }
          command -v patchelf >/dev/null || { echo "::error::patchelf missing"; exit 1; }
          command -v xvfb-run >/dev/null || { echo "::error::xvfb missing"; exit 1; }

      - name: Install Python engine deps (sidecar build)
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[full]" pyinstaller

      - name: Build engine sidecar (PyInstaller onedir)
        run: |
          set -euo pipefail
          # scripts/build-engine.sh is POSIX and handles Windows itself (it
          # picks the .exe suffix and takes its interpreter from PYTHON).
          PYTHON="$(command -v python3 || command -v python)"
          export PYTHON
          echo "using PYTHON=$PYTHON"
          scripts/build-engine.sh
          test -f ui/dist/index.html || { echo "::error::ui/dist/index.html missing"; exit 1; }
          ENGINE_BIN="src-tauri/binaries/engine/${{ matrix.engine_binary }}"
          test -f "$ENGINE_BIN" || {
            echo "::error::engine sidecar not found at $ENGINE_BIN (target ${{ matrix.target }})"
            ls -la src-tauri/binaries/engine || true
            exit 1
          }
          if [ "${RUNNER_OS}" != "Windows" ]; then
            test -x "$ENGINE_BIN" || { echo "::error::$ENGINE_BIN is not executable"; exit 1; }
          fi
          echo "engine sidecar OK: $ENGINE_BIN ($(du -sh src-tauri/binaries/engine | cut -f1))"
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"

      - name: Fetch media binaries (ffmpeg/ffprobe/yt-dlp)
        run: |
          set -euo pipefail
          chmod +x scripts/fetch-media-binaries.sh
          # The script auto-detects the host platform (Darwin/Linux/MINGW) and
          # fetches the matching ffmpeg/ffprobe/yt-dlp. Pass the OS explicitly so
          # a mis-detecting shell cannot silently fetch the wrong architecture.
          case "${RUNNER_OS}" in
            macOS)   PLATFORM=macos-arm64 ;;
            Linux)   PLATFORM=linux-x64 ;;
            Windows) PLATFORM=win-x64 ;;
            *) echo "::error::unsupported runner OS ${RUNNER_OS}"; exit 1 ;;
          esac
          scripts/fetch-media-binaries.sh "$PLATFORM"
          # Guard: the resources are consumed by bundle.resources, so an empty
          # directory means the packaged app would ship without media tools.
          if [ "${RUNNER_OS}" = "Windows" ]; then
            test -f src-tauri/binaries/ffmpeg/ffmpeg.exe
            test -f src-tauri/binaries/ffmpeg/ffprobe.exe
            test -f src-tauri/binaries/ytdlp/yt-dlp.exe
          else
            test -x src-tauri/binaries/ffmpeg/ffmpeg
            test -x src-tauri/binaries/ffmpeg/ffprobe
            test -x src-tauri/binaries/ytdlp/yt-dlp
          fi
          echo "media binaries present"

      - name: Assert the bundled media binaries are pinned and checksummed
        run: |
          set -euo pipefail
          # scripts/fetch-media-binaries.sh verifies every download against the
          # SHA-256 in scripts/media-binaries.lock and writes this record; the
          # checker fails on a missing record, a missing artifact, or an
          # UNPINNED entry (XPST_ALLOW_UNPINNED_MEDIA=1 dev escape hatch).
          scripts/verify-media-binaries-provenance.sh src-tauri/binaries/PROVENANCE.txt
          cp src-tauri/binaries/PROVENANCE.txt "$RUNNER_TEMP/media-binaries-PROVENANCE-${{ matrix.target }}.txt"
          {
            echo "### Media binary provenance (${{ matrix.target }})"
            echo '```'
            cat src-tauri/binaries/PROVENANCE.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Import Apple signing cert (if secrets present)
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != null && env.APPLE_CERTIFICATE != ''
        id: cert
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.11.4 --locked

      - name: Build Tauri app + bundles
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          export TAURI_SIGNING_PRIVATE_KEY="${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}"
          export TAURI_SIGNING_PRIVATE_KEY_PASSWORD="${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}"
          if [ "${RUNNER_OS}" = "macOS" ]; then
            # An empty Apple signing/notarization variable is NOT the same as an
            # absent one: Tauri treats a set-but-empty APPLE_SIGNING_IDENTITY as
            # an identity named "" and every bundle fails with
            # `codesign: no identity found`. The repository has no Apple
            # secrets, so drop the variables instead of passing empty strings.
            for var in APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID APPLE_CERTIFICATE; do
              if [ -z "${!var:-}" ]; then
                unset "$var" || true
              fi
            done
          fi
          # Build the configured bundle set whether or not an updater key is
          # present. Downgrading the list to `app` here silently produced no
          # installer at all; createUpdaterArtifacts is false in
          # tauri.conf.json, so an absent key simply means ad-hoc signing.
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "updater signing key present: building ${{ matrix.bundles }} with signed updater artifacts"
          else
            echo "no TAURI_SIGNING_PRIVATE_KEY: building ${{ matrix.bundles }} with Tauri's default ad-hoc signing"
          fi
          echo "cargo tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}"
          cargo tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Assert the expected installer was produced
        run: |
          set -euo pipefail
          echo "--- installer-like bundles under src-tauri/target ---"
          find src-tauri/target -path '*bundle*' -type f \
            \( -name '*.dmg' -o -name '*.exe' -o -name '*.msi' \
               -o -name '*.deb' -o -name '*.AppImage' \) -print || true
          case "${RUNNER_OS}" in
            macOS)
              INSTALLER=$(find src-tauri/target -type f -path '*bundle/dmg/*.dmg' -print -quit)
              [ -n "$INSTALLER" ] || {
                echo "::error::no .dmg was produced; the macOS lane cannot publish a stranger installer (target ${{ matrix.target }}, bundles ${{ matrix.bundles }})"
                exit 1
              }
              ;;
            Windows)
              INSTALLER=$(find src-tauri/target -type f \
                \( -path '*bundle/nsis/*.exe' -o -path '*bundle/msi/*.msi' \) -print -quit)
              [ -n "$INSTALLER" ] || {
                echo "::error::Windows lane produced no NSIS .exe or .msi installer (target ${{ matrix.target }}, bundles ${{ matrix.bundles }})"
                exit 1
              }
              ;;
            Linux)
              INSTALLER=$(find src-tauri/target -type f \
                \( -path '*bundle/deb/*.deb' -o -path '*bundle/appimage/*.AppImage' \) -print -quit)
              [ -n "$INSTALLER" ] || {
                echo "::error::Linux lane produced no .deb or .AppImage installer (target ${{ matrix.target }}, bundles ${{ matrix.bundles }})"
                exit 1
              }
              ;;
            *)
              echo "::error::unsupported runner ${RUNNER_OS}"
              exit 1
              ;;
          esac
          echo "expected installer present: $INSTALLER"

      - name: Verify installer size gate (<=200MB)
        run: |
          set -euo pipefail
          # Gate the artifact a stranger actually downloads, not the unpacked
          # bundle: the .dmg/.AppImage/.exe compresses far below the .app it was
          # built from, so measuring the app failed a perfectly shippable
          # installer. The unpacked size is still reported as a warning so bloat
          # stays visible.
          case "${RUNNER_OS}" in
            macOS)   PATTERN='*bundle/dmg/*.dmg' ;;
            Windows) PATTERN='*bundle/nsis/*.exe' ;;
            Linux)   PATTERN='*bundle/appimage/*.AppImage' ;;
            *) echo "::error::unsupported runner ${RUNNER_OS}"; exit 1 ;;
          esac
          INSTALLER=$(find src-tauri/target -path "$PATTERN" -print -quit)
          # Fall back to the other configured bundle type when the preferred one
          # was not produced; the assert step above guarantees an installer
          # exists, so this only chooses which one to measure.
          if [ -z "$INSTALLER" ]; then
            case "${RUNNER_OS}" in
              Windows) PATTERN='*bundle/msi/*.msi' ;;
              Linux)   PATTERN='*bundle/deb/*.deb' ;;
            esac
            INSTALLER=$(find src-tauri/target -path "$PATTERN" -print -quit)
          fi
          [ -n "$INSTALLER" ] || { echo "::error::no installer matched ${PATTERN}"; exit 1; }
          BYTES=$(wc -c < "$INSTALLER" | tr -d ' ')
          SIZE_MB=$((BYTES / 1048576))
          echo "installer (what a stranger downloads): ${INSTALLER} -> ${SIZE_MB}MB (${BYTES} bytes)"
          if [ "${RUNNER_OS}" = "macOS" ]; then
            APP_PATH=$(find src-tauri/target -type d -name "xPST.app" -path "*release*" -print -quit || true)
            if [ -n "${APP_PATH}" ]; then
              APP_MB=$(du -sm "$APP_PATH" | cut -f1)
              echo "unpacked app bundle: ${APP_MB}MB"
              if [ "$APP_MB" -gt 200 ]; then
                echo "::warning::unpacked xPST.app is ${APP_MB}MB, over the 200MB app target; the published installer is ${SIZE_MB}MB"
              fi
            fi
          fi
          if [ "$SIZE_MB" -gt 200 ]; then
            echo "::error::installer ${SIZE_MB}MB exceeds the 200MB gate"
            exit 1
          fi
          echo "installer size gate: PASS (${SIZE_MB}MB <= 200MB)"

      - name: Upload installers (per target)
        uses: actions/upload-artifact@v4
        with:
          name: xPST-${{ matrix.target }}
          # A --target build lands under target/<triple>/release/bundle, so a
          # literal target/release/bundle path matches nothing. Glob it, and
          # cover every bundle type so this single step serves all three lanes.
          path: |
            src-tauri/target/**/bundle/macos/xPST.app
            src-tauri/target/**/bundle/macos/*.app.tar.gz
            src-tauri/target/**/bundle/macos/*.app.tar.gz.sig
            src-tauri/target/**/bundle/dmg/*.dmg
            src-tauri/target/**/bundle/nsis/*.exe
            src-tauri/target/**/bundle/msi/*.msi
            src-tauri/target/**/bundle/deb/*.deb
            src-tauri/target/**/bundle/appimage/*.AppImage
          if-no-files-found: error

      - name: "Smoke boot (macOS) — app launches and stays up"
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          APP_PATH=$(find src-tauri/target -type d -path "*release*" -name "xPST.app" -print -quit)
          test -n "$APP_PATH" || { echo "::error::xPST.app not found — smoke would have silently no-op'd"; exit 1; }
          # macOS ships no GNU `timeout`, so bound the wait with a watchdog
          # instead of `timeout 60 ...`.
          BIN=$(ls "$APP_PATH/Contents/MacOS/"*)
          LOG="$RUNNER_TEMP/xpst-smoke-boot.log"
          "$BIN" > "$LOG" 2>&1 &
          APP_PID=$!
          sleep 15
          if ! kill -0 $APP_PID 2>/dev/null; then
            echo "::error::App exited during smoke boot"
            cat "$LOG" || true
            exit 1
          fi
          kill $APP_PID 2>/dev/null || true
          echo "--- smoke boot log (first 40 lines) ---"
          head -40 "$LOG" || true
          echo "PASS: macOS app stayed up for 15s"

      - name: "Smoke boot (Linux) — the real .AppImage runs under xvfb with the engine sidecar"
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          APPIMAGE=$(find src-tauri/target -type f -path '*bundle/appimage/*.AppImage' -print -quit)
          if [ -z "$APPIMAGE" ]; then
            DEB=$(find src-tauri/target -type f -path '*bundle/deb/*.deb' -print -quit)
            echo "::error::no .AppImage to smoke (deb=${DEB:-none})"
            exit 1
          fi
          chmod +x "$APPIMAGE"
          # Container/VM friendly WebKitGTK: the DMABUF renderer crashes on CI
          # runners with no GPU.
          export WEBKIT_DISABLE_COMPOSITING_MODE=1
          export WEBKIT_DISABLE_DMABUF_RENDERER=1

          # First try a real FUSE mount (what a desktop user gets). GitHub's
          # runner VMs do not always have a working /dev/fuse + fusermount, so
          # fall back to the AppImage runtime's own extraction mode, which runs
          # the same payload and still exports APPDIR for resource lookup.
          smoke_once() {  # $1 = log file
            local log="$1"
            xvfb-run -a "$APPIMAGE" > "$log" 2>&1 &
            local pid=$!
            local up=0
            for _ in $(seq 1 45); do
              sleep 1
              if ! kill -0 "$pid" 2>/dev/null; then
                return 1
              fi
              if pgrep -f 'xpst-engine' >/dev/null 2>&1; then up=1; break; fi
            done
            pkill -f 'xpst-engine' 2>/dev/null || true
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            [ "$up" -eq 1 ]
          }

          if smoke_once "$RUNNER_TEMP/xpst-smoke-fuse.log"; then
            echo "PASS: .AppImage FUSE-mounted, app alive, engine sidecar running"
          else
            echo "--- FUSE-mount attempt did not boot; output follows ---"
            cat "$RUNNER_TEMP/xpst-smoke-fuse.log" || true
            export APPIMAGE_EXTRACT_AND_RUN=1
            if smoke_once "$RUNNER_TEMP/xpst-smoke-extract.log"; then
              echo "PASS: .AppImage extract-and-run, app alive, engine sidecar running"
              echo "(FUSE mount unavailable on this runner; the payload ran anyway)"
            else
              echo "::error::.AppImage did not boot under either a FUSE mount or extract-and-run"
              cat "$RUNNER_TEMP/xpst-smoke-extract.log" || true
              exit 1
            fi
          fi

      - name: "Smoke boot (Windows) — silent-install the NSIS setup, launch, engine sidecar alive"
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $nsis = (Get-ChildItem -Recurse -Path src-tauri/target -Filter *.exe |
                   Where-Object { $_.FullName -match 'bundle\\nsis\\' } |
                   Select-Object -First 1).FullName
          if (-not $nsis) { Write-Error 'no NSIS installer to smoke'; exit 1 }
          Write-Host "installing $nsis silently"
          Start-Process -FilePath $nsis -ArgumentList '/S' -Wait
          $dir = Join-Path $env:LOCALAPPDATA 'xPST'
          $exe = Join-Path $dir 'xPST.exe'
          if (-not (Test-Path $exe)) {
            Write-Host 'installed tree:'
            Get-ChildItem $dir -Recurse -ErrorAction SilentlyContinue | Select-Object FullName
            Write-Error "installed exe not found at $exe"
            exit 1
          }
          $proc = Start-Process -FilePath $exe -PassThru
          $engine = $false
          for ($i = 0; $i -lt 45; $i++) {
            Start-Sleep -Seconds 1
            if ($proc.HasExited) { Write-Error 'app exited before the engine became reachable'; exit 1 }
            if (Get-Process -Name 'xpst-engine' -ErrorAction SilentlyContinue) { $engine = $true; break }
          }
          if (-not $engine) { Write-Error 'engine sidecar never appeared within 45s'; exit 1 }
          Write-Host 'PASS: installed xPST alive and engine sidecar running'
          Stop-Process -Name 'xpst-engine' -ErrorAction SilentlyContinue
          Stop-Process -Id $proc.Id -ErrorAction SilentlyContinue

      - name: "Resolve release assets (tag builds only)"
        if: startsWith(github.ref, 'refs/tags/')
        id: release-assets
        run: |
          set -euo pipefail
          # A tag that publishes zero files is worse than a red lane: it looks
          # shipped. Resolve this lane's real assets, keep the provenance
          # record, and fail if there is nothing to publish.
          case "${RUNNER_OS}" in
            macOS)   PATTERNS=( '*/bundle/dmg/*.dmg' '*/bundle/macos/*.app.tar.gz' '*/bundle/macos/*.app.tar.gz.sig' ) ;;
            Windows) PATTERNS=( '*/bundle/nsis/*.exe' '*/bundle/msi/*.msi' ) ;;
            Linux)   PATTERNS=( '*/bundle/deb/*.deb' '*/bundle/appimage/*.AppImage' ) ;;
            *) echo "::error::unsupported runner ${RUNNER_OS}"; exit 1 ;;
          esac
          FILES=()
          for pattern in "${PATTERNS[@]}"; do
            while IFS= read -r found; do
              [ -n "$found" ] && FILES+=("$found")
            done < <(find src-tauri/target -type f -path "$pattern" 2>/dev/null || true)
          done
          # *.app.tar.gz / *.sig only exist when an updater signing key is set.
          [ "${#FILES[@]}" -gt 0 ] || {
            echo "::error::tag build ${GITHUB_REF_NAME} resolved no release assets for ${RUNNER_OS}; refusing to publish an empty release"
            exit 1
          }
          echo "release assets for ${RUNNER_OS}:"
          printf '  %s\n' "${FILES[@]}"
          PROV="$RUNNER_TEMP/media-binaries-PROVENANCE-${{ matrix.target }}.txt"
          test -s "$PROV" || { echo "::error::media binary provenance record missing"; exit 1; }
          FILES+=("$PROV")
          {
            echo 'files<<RELEASE_ASSETS_EOF'
            printf '%s\n' "${FILES[@]}"
            echo 'RELEASE_ASSETS_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # Resolved by the step above: the lane's own installers plus the
          # media-binary provenance record for this target.
          files: ${{ steps.release-assets.outputs.files }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          # Version tags (vX.Y.Z) publish; a documented dry-run tag
          # (dryrun-tauri-*) exercises the exact same path into a DRAFT release
          # so the tag lane can be proven without publishing anything.
          draft: ${{ !startsWith(github.ref_name, 'v') }}
          prerelease: false
