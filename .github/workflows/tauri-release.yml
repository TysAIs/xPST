name: Tauri Shell Release

# Builds signed Tauri updater artifacts for every desktop target.  The four
# platform artifacts are consumed by publish-updater.yml, which attaches them
# to the canonical GitHub release and turns them into the GitHub Pages
# latest.json endpoint.

on:
  push:
    tags:
      - "v*.*.*"
    paths:
      - "src-tauri/**"
      - "ui/**"
      - "build_engine.spec"
      - "scripts/build-engine.sh"
      - "scripts/fetch-media-binaries.sh"
      - "scripts/gen-updater-manifest.py"
      - "scripts/verify_release_version.py"
      - "pyproject.toml"
      - ".github/workflows/tauri-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tauri-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: "app"
            media: macos-arm64
          - platform: darwin-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            bundles: "app"
            media: macos-x64
          - platform: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: "nsis"
            media: win-x64
          - platform: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bundles: "appimage"
            media: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install Linux bundler dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2

      - name: Verify release version
        run: python scripts/verify_release_version.py

      - name: Build Svelte UI
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Install Python engine dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[full]" pyinstaller

      - name: Build engine sidecar (PyInstaller onedir)
        shell: bash
        run: |
          scripts/build-engine.sh
          test -f ui/dist/index.html
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            test -f src-tauri/binaries/engine/xpst-engine.exe
          else
            test -x src-tauri/binaries/engine/xpst-engine
          fi
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"

      - name: Fetch media binaries
        shell: bash
        run: |
          chmod +x scripts/fetch-media-binaries.sh
          scripts/fetch-media-binaries.sh "${{ matrix.media }}"

      - name: Import Apple signing certificate
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.11.4 --locked

      - name: Build signed Tauri updater artifact
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is required: createUpdaterArtifacts is enabled" >&2
            exit 1
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo tauri build --target "${{ matrix.target }}" --bundles "${{ matrix.bundles }}"

      - name: Collect updater artifact and signature
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p release-assets
          ARTIFACT="$(python - "$PLATFORM" <<'PY'
          import sys
          from pathlib import Path

          platform = sys.argv[1]
          patterns = {
              "darwin-aarch64": ("*.app.tar.gz",),
              "darwin-x86_64": ("*.app.tar.gz",),
              "windows-x86_64": ("*setup.exe", "*.exe"),
              "linux-x86_64": ("*.AppImage",),
          }
          candidates = sorted(
              path for pattern in patterns[platform]
              for path in Path("src-tauri/target").rglob(pattern)
              if path.is_file() and not path.name.endswith(".sig") and "bundle" in path.parts
          )
          # A Windows NSIS build can match both patterns; deduplicate paths.
          candidates = sorted(set(candidates))
          if len(candidates) != 1:
              raise SystemExit(
                  f"expected one updater artifact for {platform}, found: "
                  + ", ".join(str(path) for path in candidates)
              )
          print(candidates[0])
          PY
          )"
          [[ -f "$ARTIFACT.sig" ]] || {
            echo "missing updater signature: $ARTIFACT.sig" >&2
            exit 1
          }
          DEST="release-assets/${PLATFORM}-$(basename "$ARTIFACT")"
          cp "$ARTIFACT" "$DEST"
          cp "$ARTIFACT.sig" "$DEST.sig"
          printf 'collected %s and %s\n' "$DEST" "$DEST.sig"

      - name: Upload platform updater artifact
        uses: actions/upload-artifact@v4
        with:
          name: xPST-updater-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error
