[package]
name = "xpst-shell"
version = "1.1.0"
description = "xPST desktop shell — Tauri 2 wrapper around the Python engine sidecar"
edition = "2021"
rust-version = "1.77"

[lib]
name = "xpst_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
# Native OS file picker for the composer's "Choose file…" control. First-party
# Tauri 2 plugin (rfd under the hood), and the only way the app can hand the UI
# a real filesystem path instead of copying the file's bytes into the webview.
tauri-plugin-dialog = "2"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
