[package]
name = "xpst-tauri-poc"
version = "0.1.0"
description = "xPST Tauri 2 shell POC (throwaway prototype)"
edition = "2021"
rust-version = "1.77"

[lib]
name = "xpst_tauri_poc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-updater = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
